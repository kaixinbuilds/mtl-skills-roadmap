<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MTL Skills Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: wall-chart scope & sequence. Sticky control bar; five views; paper colour code shared by all three languages. */
:root{
 --bg:#f5f6f4;--paper:#fff;--ink:#1c2320;--muted:#5d6863;--line:#dce1dd;--soft:#eef1ee;--acc:#2a3b34;
 --p1:#1f5f99;--p1bg:#e2ecf7;--p2:#237047;--p2bg:#dff0e5;--p3:#b2561b;--p3bg:#fbe6d6;
 --cl:#b0412b;--ml:#1d7457;--tl:#5446ad;
 --f-d:"Newsreader",Georgia,serif;--f-b:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans Tamil",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--paper:#1a201d;--ink:#e6ebe8;--muted:#9aa6a0;--line:#2c3430;--soft:#212824;--acc:#cfe0d7;
 --p1:#86b6e6;--p1bg:#1b2d40;--p2:#7fd0a2;--p2bg:#183427;--p3:#f0a169;--p3bg:#3a2518;--cl:#ef7d63;--ml:#5cc49b;--tl:#a497f2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131816;--paper:#1a201d;--ink:#e6ebe8;--muted:#9aa6a0;--line:#2c3430;--soft:#212824;--acc:#cfe0d7;
 --p1:#86b6e6;--p1bg:#1b2d40;--p2:#7fd0a2;--p2bg:#183427;--p3:#f0a169;--p3bg:#3a2518;--cl:#ef7d63;--ml:#5cc49b;--tl:#a497f2;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
[lang="ta"]{font-family:"Noto Sans Tamil",var(--f-b)}
body{margin:0}
.inner{max-width:1280px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box}
header .x-unused h1{font-family:var(--f-d);font-weight:650;font-size:clamp(28px,4vw,42px);line-height:1.1;margin:0;text-wrap:balance}
header .x-unused p{margin:8px 0 0;color:var(--muted);max-width:75ch}
.eyebrow{font-family:var(--f-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding-block:16px 4px}.bar:not(:has(.seg:not([hidden]) button)):not(:has(.key:not([hidden]) .pill)){display:none}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .lab{font-size:12px;color:var(--muted);margin-right:4px}
.seg button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 11px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
/* site chrome */
header.site{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
header.site .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cl),var(--tl) 55%,var(--ml));color:#fff;font-family:var(--f-m);font-size:11px;letter-spacing:.06em;font-weight:500;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.15}.bt b{font-family:var(--f-d);font-size:20px;font-weight:650}.bt small{font-family:var(--f-m);font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
header.site nav{overflow-x:auto;scrollbar-width:none}header.site nav::-webkit-scrollbar{display:none}
.tabs{flex-wrap:nowrap!important;gap:0!important;white-space:nowrap}
.tabs .grp{display:flex;align-items:flex-end;gap:2px;padding-right:14px;margin-right:14px;border-right:1px solid var(--line)}.tabs .grp:last-child{border-right:0}
.tabs .gl{display:none}
.tabs button{border:0!important;border-bottom:2px solid transparent!important;border-radius:0!important;background:transparent!important;padding:10px 8px 9px!important;color:var(--muted)!important;font-size:14px!important;font-weight:500}
.tabs button:hover{color:var(--ink)!important}
.tabs button[aria-pressed="true"]{color:var(--ink)!important;border-bottom-color:var(--ink)!important;font-weight:600}
.hero{background:radial-gradient(1200px 300px at 10% -40%,color-mix(in srgb,var(--ml) 14%,transparent),transparent),radial-gradient(900px 260px at 95% -30%,color-mix(in srgb,var(--tl) 14%,transparent),transparent),var(--bg);border-bottom:1px solid var(--line)}
.hero .inner{padding-block:34px 28px}
.hero h1{font-family:var(--f-d);font-weight:650;font-size:clamp(30px,4.4vw,48px);line-height:1.06;margin:6px 0 10px;text-wrap:balance}
.hero .lead{font-size:clamp(16px,1.6vw,19px);max-width:70ch;margin:0 0 18px;color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kpi{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--bg);font-family:var(--f-m);font-size:11.5px}
.kpi p{margin:0;font-size:13.5px}
.hero .use{margin:14px 0 0;font-size:13px;color:var(--muted)}
main#view{padding-block:18px 56px;display:flex;flex-direction:column;gap:22px}
main#view>section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,2.4vw,28px);box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.12);min-width:0}
main#view>section h2{font-size:26px}
main#view>section .scroll,main#view>section .slicer{background:var(--paper)}
footer.site{background:var(--acc);color:var(--bg);margin-top:20px}
footer.site .inner{padding-block:36px 28px}
footer.site a{color:inherit;text-decoration:underline;text-underline-offset:2px}
footer.site h4{font-family:var(--f-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;opacity:.75}
footer.site p,footer.site li{font-size:13px;opacity:.9}footer.site ul{margin:0;padding-left:18px}
.fgrid{display:grid;grid-template-columns:1.2fr 1.4fr 1fr;gap:28px}
.fb{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-size:20px}
footer.site .fine{font-size:12px;opacity:.7;margin-top:14px}
/* source colour code: CPDD-written vs derived vs mapped by reasoning */
:root{--s-cpdd:#2747b8;--s-cpddbg:#e3e9fb;--s-der:#127a7a;--s-derbg:#dcf1f0;--s-inf:#b5650a;--s-infbg:#fbeedc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s-cpdd:#8ea6ff;--s-cpddbg:#1c2547;--s-der:#5fd0cc;--s-derbg:#13312f;--s-inf:#f2a94f;--s-infbg:#3a2a14}}
:root[data-theme="dark"]{--s-cpdd:#8ea6ff;--s-cpddbg:#1c2547;--s-der:#5fd0cc;--s-derbg:#13312f;--s-inf:#f2a94f;--s-infbg:#3a2a14}
.src-cpdd{--sc:var(--s-cpdd);--sbg:var(--s-cpddbg)}.src-derived{--sc:var(--s-der);--sbg:var(--s-derbg)}.src-infer{--sc:var(--s-inf);--sbg:var(--s-infbg)}
.ucard[class*="src-"]{border-left:5px solid var(--sc);position:relative}
.ucard[class*="src-"]{background:var(--sbg);border-color:color-mix(in srgb,var(--sc) 35%,var(--line))}
.ucard .sb{align-self:flex-start;font-family:var(--f-m);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--sc);border-radius:999px;padding:1px 8px}
.tag .pv{color:var(--paper);background:var(--sc);font-weight:500;opacity:1;border-radius:3px;padding:0 4px;margin-left:5px}
.srckey{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin:0 0 12px}
.srckey .sw{display:inline-flex;align-items:center;gap:7px}.srckey .sw i{width:16px;height:16px;border-radius:4px;background:var(--sc)}
.ucard .iq{font-size:12.5px;border-left:2px solid var(--p3);padding-left:7px;margin-top:2px}.ucard .iq b{font-family:var(--f-m);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--p3);display:block}
#ud .sk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
#ud .sk .q{font-family:var(--f-d);font-size:18px;line-height:1.25;margin:2px 0 6px}
#ud .sk .ap{display:inline-block;font-family:var(--f-m);font-size:10.5px;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 8px;margin-bottom:8px}
#ud .sk ol{margin:0;padding-left:20px}#ud .sk li{margin:4px 0}
.dims{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.dims th,.dims td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}.dims thead th{position:static}
/* IBL essence */
.ess{border-top:4px solid var(--p3)!important}
.ess h3{font-family:var(--f-d);font-size:20px;font-weight:650;margin:26px 0 10px}
.ess .big{font-size:17px;max-width:80ch;margin:8px 0 0}
.els{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.el{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}.el b{font-size:14px}.el span{font-size:13px;color:var(--muted)}
.cyc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:ph}
.ph{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.ph:not(:last-child)::after{content:"→";position:absolute;right:-10px;top:14px;color:var(--muted);font-size:14px;background:var(--paper);line-height:1}
.pn{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}.pn span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--p3);color:#fff;font-size:11.5px;font-family:var(--f-m)}
.ph p{margin:4px 0;font-size:13px}.ph p b{display:block;font-size:10.5px;font-family:var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.disc{margin-top:8px;border:1px dashed var(--p3);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--p3);background:var(--p3bg)}
.fivee{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.e5{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.e5 .l{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--p1bg);color:var(--p1);font-family:var(--f-d);font-size:20px;font-weight:650}
.e5 p{margin:0;font-size:13px}.e5 .m{margin-top:auto;font-family:var(--f-m);font-size:10.5px;color:var(--muted)}
.callout{margin:12px 0 0;border-left:4px solid var(--ml);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px}
.spec .bar3{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,var(--soft),color-mix(in srgb,var(--p3) 30%,var(--soft)));margin-bottom:10px}
.g3c{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ap,.en4{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.ap p,.en4 p{margin:4px 0 0;font-size:13px}
.exq{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:16px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.exq .q{font-family:var(--f-d);font-size:21px;line-height:1.25}.exq ol{margin:0;padding-left:20px;font-size:13.5px}.exq li{margin:3px 0}
.terms{margin-top:14px}.terms summary{cursor:pointer;font-weight:600}.terms dl{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:6px 16px;margin:10px 0 0;font-size:13px}.terms dt{font-weight:600}.terms dd{margin:0;color:var(--muted)}
@media (max-width:900px){.cyc,.g4{grid-template-columns:repeat(2,1fr)}.fivee{grid-template-columns:repeat(2,1fr)}.g3c,.exq,.fgrid{grid-template-columns:1fr}.ph::after{display:none}}
@media (max-width:520px){.cyc,.g4,.fivee{grid-template-columns:1fr}.terms dl{grid-template-columns:1fr}.bt small{display:none}.bt b{font-size:17px;white-space:nowrap}.mark{width:32px;height:32px;font-size:10px}header.site .top .seg{flex-wrap:nowrap}header.site .top .seg .lab{display:none}header.site .top .seg button{padding:4px 9px}.hero .inner{padding-block:22px 20px}}
button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.P1{color:var(--p1);background:var(--p1bg)}.P2{color:var(--p2);background:var(--p2bg)}.P3{color:var(--p3);background:var(--p3bg)}
h2{font-family:var(--f-d);font-weight:650;font-size:24px;margin:0 0 4px;text-wrap:balance}
h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--muted);margin:0 0 12px;max-width:85ch;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;font-size:13.5px}
thead th{font-family:var(--f-m);font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--soft);position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-m)}
.lc{font-weight:700} .lc.CL{color:var(--cl)} .lc.ML{color:var(--ml)} .lc.TL{color:var(--tl)}
[hidden]{display:none!important}
/* 21CC & inquiry roadmap */
.slicer{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.catbtn{border-left:4px solid var(--k)!important}
.cat-CAIT{--k:#6a4fb0}.cat-CCIS{--k:#1f7f8c}.cat-CGC{--k:#9a6a12}.cat-SEC{--k:#b0407a}.cat-DIG{--k:#4f6b8a}.cat-UG{--k:#6b7a2a}.cat-INQ{--k:#c0392b}.cat-STAR{--k:#d0701a}.cat-EPED{--k:#8a4b2a}.cat-PA_AT{--k:#4fb3bf}.cat-PA_IT{--k:#1f6f7a}.cat-PA_CL{--k:#e0a81c}.cat-PA_CM{--k:#b9541f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat-CAIT{--k:#a994ec}:root:not([data-theme="light"]) .cat-CCIS{--k:#5cc3cf}:root:not([data-theme="light"]) .cat-CGC{--k:#e0b25a}:root:not([data-theme="light"]) .cat-SEC{--k:#ec86bb}:root:not([data-theme="light"]) .cat-DIG{--k:#93b0cf}:root:not([data-theme="light"]) .cat-UG{--k:#b8c76a}:root:not([data-theme="light"]) .cat-INQ{--k:#f08273}:root:not([data-theme="light"]) .cat-STAR{--k:#f3a65e}:root:not([data-theme="light"]) .cat-EPED{--k:#d39572}}
.tag{display:inline-block;font-size:11px;border-left:3px solid var(--k);background:var(--soft);padding:0 6px;border-radius:3px;margin:0 4px 2px 0}
.ucard{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.ucard .u{font-family:var(--f-m);font-size:11.5px;color:var(--muted)}
.heat td.num{text-align:center}
.heat td.num span{display:inline-block;min-width:28px;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--k) calc(var(--a)*70%),transparent);color:var(--ink)}
table.road{min-width:960px;table-layout:fixed}.road th.s{width:150px}.road td{border-right:1px solid var(--line)}
/* course map */
table.map{min-width:960px;table-layout:fixed}
.map th.s{width:178px;background:var(--paper)}
.map tr.band td{padding:6px 10px;font-weight:600;font-size:12.5px}
.map tr.band.P1 td{background:var(--p1bg);color:var(--p1)}.map tr.band.P2 td{background:var(--p2bg);color:var(--p2)}.map tr.band.P3 td{background:var(--p3bg);color:var(--p3)}
.map td{border-right:1px solid var(--line)}
.it{border-left:3px solid var(--c);padding:3px 0 3px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px}
.it.also{border-left-style:dashed;opacity:.92}
.it .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted)}
.it .u{font-family:var(--f-m)}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink);background:var(--soft)}
.badge{font-size:10.5px;font-family:var(--f-m);letter-spacing:.04em;border-radius:4px;padding:0 5px;border:1px solid currentColor}
.badge.ex{color:var(--p1)} .badge.c21{color:var(--muted)} .badge.ibl{color:var(--p3);font-weight:600}
.en{display:block;color:var(--muted);font-size:12.5px}
.chip .en,.th .en,.inl .en{display:inline;font-size:inherit}.chip .en::before,.th .en::before,.inl .en::before{content:" · "}
.th{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted)}
.ladder{display:flex;gap:3px;margin:3px 0}
.ladder span{flex:1;height:9px;border-radius:2px;background:var(--soft)}
.lv{display:flex;gap:3px;font-family:var(--f-m);font-size:10px;color:var(--muted)} .lv span{flex:1}
.wt{display:flex;height:24px;border-radius:4px;overflow:hidden;font-size:11.5px;font-weight:600;font-family:var(--f-m)}
.wt span{display:flex;align-items:center;justify-content:center;min-width:0}
.note{font-size:12.5px;color:var(--muted)}
main{display:flex;flex-direction:column;gap:30px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.tag.inf{background:var(--paper)}
.tag .pv{font-family:var(--f-m);font-size:9.5px;opacity:.75;margin-left:3px}
.dots{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dot{display:inline-flex;gap:2px;align-items:center;padding:2px 6px;border-radius:999px;font-size:11px;background:var(--soft);border:1px solid var(--line)}
.dot i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--d)}
.dot.inf{border-style:dashed}
.d-self{--d:#8d99ae}.d-family{--d:#e07a5f}.d-school{--d:#f2cc8f}.d-community{--d:#81b29a}.d-nation{--d:#d62828}.d-world{--d:#3d405b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .d-world{--d:#a9b4ff}:root:not([data-theme="light"]) .d-nation{--d:#ff7b7b}}
.glance{border-left:4px solid var(--c);padding-left:12px}
.dm td{font-size:13px}.dm th.s{width:190px}
.ev{font-size:11.5px;color:var(--muted);font-family:var(--f-m)}

ience": {"zh": "分享经历", "ms": "Berkongsi pengalaman", "ta": "அனுபவப் பகிர்வு"}, "Inform & remind": {"zh": "说明情况、提醒", "ms": "Memaklumkan", "ta": "தகவல், நினைவூட்டல்"}, "Respond to someone's experience": {"zh": "针对他人经历表达感想", "ms": "Respons pengalaman", "ta": "அனுபவத்துக்குப் பதில்"}, "Give a view on differing opinions": {"zh": "针对不同观点发表看法", "ms": "Memberi pandangan", "ta": "கருத்துத் தெரிவித்தல்"}, "Explain with examples": {"zh": "举例说明", "ms": "Menerangkan dengan contoh", "ta": "எடுத்துக்காட்டுடன் விளக்குதல்"}, "Plan an interview": {"zh": "拟采访提纲", "ms": "Merancang wawancara", "ta": "நேர்காணல் திட்டம்"}, "Recommend": {"zh": "推荐", "ms": "Mencadangkan", "ta": "பரிந்துரைத்தல்"}, "Inform": {"zh": "说明", "ms": "Memaklumkan", "ta": "தகவல் தருதல்"}, "Share": {"zh": "分享", "ms": "Berkongsi", "ta": "பகிர்தல்"}, "Reply": {"zh": "回复", "ms": "Membalas", "ta": "பதில்"}, "Reply / enquire": {"zh": "回复、询问", "ms": "Membalas / bertanya", "ta": "பதில், வினவல்"}, "Propose": {"zh": "提议", "ms": "Usulan", "ta": "முன்மொழிதல்"}, "Appreciation": {"zh": "表达感谢", "ms": "Penghargaan", "ta": "பாராட்டு"}, "Express interest / volunteer": {"zh": "表达参与意愿", "ms": "Menyatakan minat", "ta": "ஆர்வம் தெரிவித்தல்"}, "Invite": {"zh": "邀请", "ms": "Undangan", "ta": "அழைப்பு"}, "Apply": {"zh": "申请", "ms": "Permohonan", "ta": "விண்ணப்பம்"}, "Report": {"zh": "报道", "ms": "Laporan", "ta": "அறிக்கை"}, "Persuade": {"zh": "劝说", "ms": "Memujuk", "ta": "வற்புறுத்தல்"}, "Argue": {"zh": "论证", "ms": "Berhujah", "ta": "விவாதித்தல்"}, "Request / report": {"zh": "请求、反映", "ms": "Memohon / melaporkan", "ta": "வேண்டுகோள், அறிவிப்பு"}, "Request sponsorship": {"zh": "请求赞助", "ms": "Memohon tajaan", "ta": "நிதியாதரவு வேண்டுதல்"}, "Complete a template": {"zh": "完成模板", "ms": "Melengkapkan templat", "ta": "படிவம் நிறைவுசெய்தல்"}, "Formal email": {"zh": "公务电邮", "ms": "E-mel rasmi", "ta": "அலுவல் மின்னஞ்சல்"}, "Give a view (agree/disagree)": {"zh": "赞成或反对", "ms": "Bersetuju / tidak", "ta": "ஆதரவு / எதிர்ப்பு"}}, "common": [["Skills framework", "All three follow the 2021 MTL framework of six skills: listening, speaking, reading, writing, spoken interaction and written interaction."], ["SEC paper structure", "Same three papers and the same weights for each course: G1 10/25/65, G2 30/30/40, G3 30/35/35, Higher 40/40/20 (Paper 1/2/3)."], ["Paper 1 shape", "From G2 up: one functional piece (1 of 2) worth 10%, plus one essay (1 of 3). G1 sits a single short online or social-media post (10%). Dictionaries are allowed."], ["Paper 3 shape", "G1–G3: read aloud, then a conversation prompted by a short video. Higher: a presentation of up to 2 minutes from a video, then a discussion."], ["Summary at Higher level", "Higher Chinese, Higher Malay and Higher Tamil all examine a summary in Paper 2."], ["Digital functional writing", "Emails, online posts, forums and social-media replies dominate functional writing in all three guides, matching the SEC formats."], ["Theme-based units", "All three guides organise teaching in themed units that weave the six skills together, with fewer, larger units in Sec 3–4."]], "diff": [["How a unit is built", "Three units per book. The 学习内容一览表 names one learning point per skill for each unit; @ marks written interaction and # marks oral interaction.", "Four units per book, each framed by a Pemahaman Abadi and Soalan-soalan Penting. Sec 4 has three content units and three skills units.", "Four or three units per book in Sec 1–2, seven in Sec 3, six in Sec 4. Every unit has fixed sections, ending in கற்போம்; படைப்போம் and நானும் ஒரு படைப்பாளி."], ["Signature routines (G1 guides)", "引学练用评 in every unit, with one fixed routine per skill: 听说 三看三说 (看前说, 看后说, 延伸说), 阅读 立足文本三读 (初读, 再读, 三读), 写作 先说后写再查.", "STP teaching actions head every lesson plan. Collaborative routines carry the unit: Fikir-Berpasangan-Berkongsi, Reviu Lisan, IRF questioning, Lihat-Fikir-Tanya and other thinking routines.", "A fixed ~15-period cycle: நுழைவாயில் → சிந்திப்போம்; கலந்துரையாடுவோம் → படிப்போம் → listening, viewing and reading comprehension → இனிய இலக்கணம் and இலக்கியச் சோலை → மொழி விளையாட்டு → கற்போம்; படைப்போம்."], ["How writing is taught (G1 guides)", "Staged: SLS 写作指导配套 for 审题 and micro-practice, then 先说 (oral rehearsal with scaffolds), 后写, 再查 (read aloud to a partner, peer check).", "Embedded in a Bahagian: discuss a model text (e.g. social-media comments), then write. Teks Respons is named and regular from Sec 3.", "One production task per unit in கற்போம்; படைப்போம் / நானும் ஒரு படைப்பாளி, often multimodal (e-banner, poster, comic strip, brochure)."], ["G1: when the exam writing form becomes regular", "Sec 4: all three writing units are replies to an online post (S1–S3 build the moves: narrate, describe, give a view, respond).", "Sec 3: half the tasks are Teks Respons; Sec 4 adds a writing-guide unit (formal email, response text, expository types).", "Only the last Sec 4 unit (comments on online posts). The G1 written-paper format still needs confirming."], ["Oral and read-aloud preparation (G1 guides)", "A video in every unit taught through 三看三说; 口语互动 points marked #. 朗读 technique gets little explicit teaching.", "An SLS video in every unit; view-giving guides rise from Mari Berkongsi Pandangan (Sec 1) to Memberikan Pandangan (Sec 3); explicit Panduan Bacaan Lantang from Sec 1.", "Viewing comprehension every unit; from Sec 3, speaking about pictures in பேச்சுத்தமிழ் clearly, fluently and confidently; read-aloud inside படிப்போம் (pausing in Sec 1, intonation in Sec 4)."], ["Topic scope across Sec 1–4", "A spiral each semester (self → family/school → community → Singapore/world), not one widening over four years.", "Widens, and each unit is tagged with a Domain: Diri/Sekolah in Sec 1, Masyarakat in Sec 2, Rantau by the end of Sec 3; Sec 4 returns to Diri/Masyarakat and skills units.", "Themes rotate each year (relationships, heritage, health, nature, S&T, life skills); society and nation enters in Sec 2, and the world and us closes Sec 3 and Sec 4."], ["Unit themes", "G2, G3 and Higher share Sec 1–2 themes; G1 shares most. Themes split by course in Sec 3–4.", "Each course has its own unit titles; Higher Malay titles are proverbs. Sec 4 shares big ideas (technology, Singapore, diaspora).", "Every course shares the same theme and sub-theme each year."], ["Essay genres examined", "记叙文, 说明文, 议论文 (Higher adds 演讲词).", "Naratif and ekspositori only.", "'Essay or story' (கட்டுரை/கதை); genres are not named."], ["Functional formats examined", "G2/G3: email (reply, or from material). Higher: email or online-forum post.", "G2 up: forum/blog post (informal) or formal email (e.g. praise, report an incident, complain).", "G2/G3: relational or formal email. Higher: formal email or forum post (கருத்துக்களம்)."], ["Length (G3 / Higher)", "Email ≥150, essay ≥300 characters / ≥220 and ≥500.", "Functional ≥120, essay ≥240 words / ≥140 and ≥380.", "Email ≥110, essay ≥200 words / ≥130 and ≥300."], ["When email is first taught", "Sec 1: reply email in 1A/1上 Unit 3 (G2, G3, Higher). G1 starts with posts and messages.", "Formal email first appears in Sec 3 (G2, G3, Higher).", "Informal email in Sec 1, formal email in Sec 2."], ["Argument", "Opinion from facts in Sec 1, then named argument methods (举例, 引用, 对比, 比喻) in Sec 3–4.", "No argumentative essay. Views go into functional texts; a persuasive speech text appears in G3 Sec 4.", "Debate and an argumentative essay (விவாதக் கட்டுரை) in Sec 3 for G3 and Higher."], ["Expository", "Explaining features, charts and procedures from Sec 1, mostly through @ functional tasks.", "Expository dominates Sec 2, building paragraph by paragraph; types: deskripsi, proses, sebab-akibat, perbandingan, masalah-penyelesaian.", "Expository essay (விளக்கக் கட்டுரை) arrives in Sec 3."], ["Narrative", "Craft techniques: thread, detail and brevity, flashback, 夹叙夹议; 材料作文 in Sec 4.", "Story elements in Sec 1 (setting, conflict, climax), then penceritaan semula (retelling) throughout.", "Event essays in Sec 1–2, experience essay in Sec 4."], ["Summary", "Higher only: 缩写 in Sec 3; 片段缩写 (~80 characters) in the exam.", "Examined only in Higher Malay (≤60 words); hardly practised in the guides.", "Practised from Sec 1 in G3 and Higher (35–60 words); examined in Higher Tamil."], ["Grammar in the guides", "语文知识 every unit (connectives, rhetoric). Higher adds formal grammar and 病句 correction in Sec 3.", "Mahir Bahasa every unit: word classes, affixes, sentence types.", "இனிய இலக்கணம் every unit, following the syllabus appendix (sandhi, verb forms, case)."], ["Paper 2 language items", "Cloze; 词语替换 (G3); 病句改正 (Higher).", "Word classes; replacing wrongly inflected or used words.", "Idioms and paired words; cloze; error correction (G3); சொற்புணர்ச்சி (Higher)."], ["21CC in the guides", "Not tagged per unit; appendix with framework and one worked example.", "Not tagged per unit; a few Sec 4 notes (digital and civic literacy).", "Tagged on every activity in the unit overviews."], ["Inquiry-based learning", "Syllabus advocates 探究式学习; guides don't tag it.", "Syllabus lists STAR Team Inquiry; guides flag IBL explicitly in Sec 3 Unit 4 (G1, G2) and STAR in many units; every unit has essential questions.", "Syllabus §4.9 வினவல்வழிக் கற்றல்; guides tag it in G3 Sec 2."]], "diffEn": [["How a unit is built", "Three units per book. A summary table at the front of each guide names one learning point per skill for each unit and marks written and oral interaction points.", "Four units per book, each framed by an enduring understanding and essential questions. Sec 4 has three content units and three skills units.", "Four or three units per book in Sec 1–2, seven in Sec 3, six in Sec 4. Every unit has fixed sections, ending in two writing sections ('Let's learn, let's create' and 'I am a creator')."], ["Signature routines (G1 guides)", "Every unit runs engage, learn, practise, apply, assess, with one fixed routine per skill: three viewing stages for listening and speaking, three readings for reading, and say, write, check for writing.", "STP teaching actions head every lesson plan. Collaborative routines carry the unit: Think-Pair-Share, oral review, IRF questioning, See-Think-Wonder and other thinking routines.", "A fixed ~15-period cycle: entry hook → think and discuss → read aloud and vocabulary → listening, viewing and reading comprehension → grammar and literature → language games → 'Let's learn, let's create'."], ["How writing is taught (G1 guides)", "Staged: an SLS writing pack for reading the task and micro-practice, then oral rehearsal with scaffolds, writing, and a read-aloud peer check.", "Embedded in a lesson part: discuss a model text (e.g. social-media comments), then write. The response text is named and regular from Sec 3.", "One production task per unit in 'Let's learn, let's create' / 'I am a creator', often multimodal (e-banner, poster, comic strip, brochure)."], ["G1: when the exam writing form becomes regular", "Sec 4: all three writing units are replies to an online post (Sec 1–3 build the moves: narrate, describe, give a view, respond).", "Sec 3: half the tasks are response texts; Sec 4 adds a writing-guide unit (formal email, response text, expository types).", "Only the last Sec 4 unit (comments on online posts). The G1 written-paper format still needs confirming."], ["Oral and read-aloud preparation (G1 guides)", "A video in every unit taught through the three viewing stages; spoken-interaction points are marked. Read-aloud technique gets little explicit teaching.", "An SLS video in every unit; view-giving guides rise from sharing views (Sec 1) to giving a view (Sec 3); explicit read-aloud guides from Sec 1.", "Viewing comprehension every unit; from Sec 3, speaking about pictures in spoken Tamil clearly, fluently and confidently; read-aloud inside the reading section (pausing in Sec 1, intonation in Sec 4)."], ["Topic scope across Sec 1–4", "A spiral each semester (self → family/school → community → Singapore/world), not one widening over four years.", "Widens, and each unit is tagged with a domain: self and school in Sec 1, society in Sec 2, the region by the end of Sec 3; Sec 4 returns to self and society, plus skills units.", "Themes rotate each year (relationships, heritage, health, nature, S&T, life skills); society and nation enters in Sec 2, and the world and us closes Sec 3 and Sec 4."], ["Unit themes", "G2, G3 and Higher share Sec 1–2 themes; G1 shares most. Themes split by course in Sec 3–4.", "Each course has its own unit titles; Higher Malay titles are proverbs. Sec 4 shares big ideas (technology, Singapore, diaspora).", "Every course shares the same theme and sub-theme each year."], ["Essay genres examined", "Narrative, expository and argumentative (Higher adds speeches).", "Narrative and expository only.", "'Essay or story'; genres are not named."], ["Functional formats examined", "G2/G3: email (reply, or from material). Higher: email or online-forum post.", "G2 up: forum/blog post (informal) or formal email (e.g. praise, report an incident, complain).", "G2/G3: informal or formal email. Higher: formal email or forum post."], ["Length (G3 / Higher)", "Email ≥150, essay ≥300 characters / ≥220 and ≥500.", "Functional ≥120, essay ≥240 words / ≥140 and ≥380.", "Email ≥110, essay ≥200 words / ≥130 and ≥300."], ["When email is first taught", "Sec 1: reply email in Book 1A Unit 3 (G2, G3, Higher). G1 starts with posts and messages.", "Formal email first appears in Sec 3 (G2, G3, Higher).", "Informal email in Sec 1, formal email in Sec 2."], ["Argument", "Opinion from facts in Sec 1, then named argument methods (example, quotation, contrast, analogy) in Sec 3–4.", "No argumentative essay. Views go into functional texts; a persuasive speech text appears in G3 Sec 4.", "Debate and an argumentative essay in Sec 3 for G3 and Higher."], ["Expository", "Explaining features, charts and procedures from Sec 1, mostly through functional tasks.", "Expository dominates Sec 2, built paragraph by paragraph; types: description, process, cause–effect, comparison, problem–solution.", "Expository essay arrives in Sec 3."], ["Narrative", "Craft techniques: thread, detail and brevity, flashback, narration with commentary; material-based essays in Sec 4.", "Story elements in Sec 1 (setting, conflict, climax), then retelling throughout.", "Event essays in Sec 1–2, experience essay in Sec 4."], ["Summary", "Higher only: condensing in Sec 3; a ~80-character summary in the exam.", "Examined only in Higher Malay (≤60 words); hardly practised in the guides.", "Practised from Sec 1 in G3 and Higher (35–60 words); examined in Higher Tamil."], ["Grammar in the guides", "Language knowledge every unit (connectives, rhetoric). Higher adds formal grammar and sentence correction in Sec 3.", "Grammar every unit: word classes, affixes, sentence types.", "Grammar every unit, following the syllabus appendix (sandhi, verb forms, case)."], ["Paper 2 language items", "Cloze; word replacement (G3); sentence correction (Higher).", "Word classes; replacing wrongly inflected or used words.", "Idioms and paired words; cloze; error correction (G3); word joining (Higher)."], ["21CC in the guides", "Not tagged per unit; appendix with framework and one worked example.", "Not tagged per unit; a few Sec 4 notes (digital and civic literacy).", "Tagged on every activity in the unit overviews."], ["Inquiry-based learning", "Syllabus advocates inquiry-based learning; guides don't tag it.", "Syllabus lists STAR Team Inquiry; guides flag inquiry explicitly in Sec 3 Unit 4 (G1, G2) and STAR in many units; every unit has essential questions.", "Syllabus section 4.9 on inquiry-based learning; guides tag it in G3 Sec 2."]], "iblSyl": {"MTL": "MTL syllabus 2021: inquiry is not named as an approach (it appears only in a reference).", "CL": "CL T&L syllabus 2021 names 探究式学习 four times: learning through 自主、同侪协作、探究; 21CC goal 能主动进行探究式学习; principle 2 倡导同侪协作，通过探究式学习发展思维; and in 教学方面 通过协作和探究式学习发展语言交际能力和思维能力.", "ML": "ML T&L syllabus 2021 lists STAR (Analisis Senario, Inkuiri Berpasukan, Aplikasi dan Refleksi / Team Inquiry) among teaching activities. Every JATi unit is built around a Pemahaman Abadi (enduring understanding) and Soalan-soalan Penting (essential questions).", "TL": "TL T&L syllabus 2021 §4.9 வினவல்வழிக் கற்றல் (inquiry-based learning): learning driven by questions, problems and situations, with the teacher as facilitator and students generating their own research questions."}, "iblSylEn": {"MTL": "MTL syllabus 2021: inquiry is not named as an approach (it appears only in a reference).", "CL": "The CL syllabus names inquiry-based learning four times: learning through self-directed, peer-collaborative and inquiry modes; a 21CC goal of taking the initiative in inquiry; a principle of developing thinking through collaborative inquiry; and in pedagogy, building communication and thinking through collaborative and inquiry-based learning.", "ML": "The ML syllabus lists STAR (Scenario Analysis, Team Inquiry, Application and Reflection) among its teaching activities. Every unit in the ML guides is built around an enduring understanding and essential questions.", "TL": "The TL syllabus section 4.9 covers inquiry-based learning: learning driven by questions, problems and situations, with the teacher as facilitator and students generating their own research questions."}, "iblTg": {"CL": "《华文伴我行》教师手册 do not tag units for inquiry. Every book's 差异教学 notes name 引导——探究 (guided inquiry) as one of two teaching modes, and every unit ends with 文化探索 (look it up and share) and a 综合任务 (integrated task: 展示、交流、反思). 探究 itself appears once or twice per book; 综合任务 about twenty times.", "ML": "JATi guides flag inquiry explicitly in Sec 3 Unit 4 (G1 and G2: social-enterprise plan, 'pembelajaran berasaskan inkuiri', usable as a WA) and suggest STAR Team Inquiry in about a dozen units.", "TL": "TL guides tag 'மின்வழிக் கற்பித்தல் அணுகுமுறை – வினவல்வழிக் கற்றல்' (e-pedagogy: inquiry-based learning) in G3 Sec 2 (2A Units 2–3)."}, "iblTgEn": {"CL": "The CL guides don't tag units for inquiry. Every book's differentiated-instruction notes name guided inquiry (引导——探究) as one of two teaching modes, and every unit ends with a culture-exploration extension (look it up online and share) and an integrated task (make, present, reflect). The word inquiry appears once or twice per book; the integrated task about twenty times.", "ML": "The ML guides flag inquiry explicitly in Sec 3 Unit 4 (G1 and G2: social-enterprise plan, usable as a WA) and suggest STAR Team Inquiry in about a dozen units.", "TL": "The TL guides tag 'e-pedagogy: inquiry-based learning experience' in G3 Sec 2 (Book 2A Units 2–3)."}, "c21": {"CL": "Not tagged per unit. Each guide's appendix sets out 21世纪技能目标及发展阶段 and one worked example (Sec 1 Unit 3 《相约狮城》) of building a unit goal from 21CC.", "ML": "Not tagged per unit. A few Sec 4 G1 notes add 'Penerapan Kemahiran Abad ke-21' (Literasi Digital, Literasi Sivik).", "TL": "Tagged per activity in the unit overviews (21-ஆம் நூ.தி.): critical & inventive thinking, communication & information skills, civic & global literacy, social-emotional competencies."}, "c21En": {"CL": "Not tagged per unit. Each guide's appendix sets out the 21CC goals and stages, with one worked example (Sec 1 Unit 3) of building a unit goal from 21CC.", "ML": "Not tagged per unit. A few Sec 4 G1 notes add 21CC prompts (digital literacy, civic literacy).", "TL": "Tagged on every activity in the unit overviews: critical & inventive thinking, communication & information skills, civic & global literacy, social-emotional competencies."}, "syl": {"CL": {"fw": "书面互动 + 写作（实用文）", "nar": "写作：记事写人", "des": "写作：记事写人（描写）", "exp": "写作：说明事物特点、做事情的步骤", "arg": "写作：表达观点并加以论证", "lit": "写作：文学创作", "read": "阅读", "lang": "语文知识（句子结构、修辞、标点）", "sum": "阅读：整理内容要点", "edit": "写作：修改习作", "oral": "说话 / 口语互动"}, "ML": {"fw": "6.1, 6.2 Interaksi Penulisan; 4.3 (laporan, notis)", "nar": "4.2 penulisan naratif; 4.3 penceritaan semula", "des": "4.2 teks deskriptif", "exp": "4.3 penulisan informatif (penerangan, arahan, ekspositori)", "arg": "6.2 bertukar pandangan; 4.3 pujukan; 5.3", "lit": "4.2 naratif (prosa, puisi)", "read": "3.1–3.4 Membaca", "lang": "Tatabahasa (Lampiran A)", "sum": "3.2–3.3 Membaca; 4.1", "edit": "4.4 Menyemak dan menyunting", "oral": "2.x Bertutur; 5.1–5.3 Interaksi Lisan"}, "TL": {"fw": "எழுத்துவழிக் கருத்துப்பரிமாற்றம் க.வி.1–2", "nar": "எழுதுதல் க.வி.2–3", "des": "எழுதுதல் க.வி.3", "exp": "எழுதுதல் க.வி.2–3", "arg": "எழுதுதல் க.வி.3; எழுத்துவழிக் க.வி.2", "lit": "எழுதுதல் க.வி.3; படித்தல் (திறனாய்வு)", "read": "படித்தலும் நோக்கலும்", "lang": "இலக்கணம் (பின்னிணைப்பு 3)", "sum": "எழுதுதல் (சுருக்கி எழுதுதல்)", "edit": "எழுதுதல் க.வி.1", "oral": "பேசுதல்; பேச்சுவழிக் கருத்துப்பரிமாற்றம்"}}, "sylEn": {"CL": {"fw": "Written interaction + Writing (practical texts)", "nar": "Writing: recount events and portray people", "des": "Writing: description within narrative", "exp": "Writing: explain features and steps", "arg": "Writing: state and support a view", "lit": "Writing: literary creation", "read": "Reading", "lang": "Language knowledge", "sum": "Reading: organise key points", "edit": "Writing: revise own work", "oral": "Speaking / Spoken interaction"}, "ML": {"fw": "6.1, 6.2 written interaction; 4.3 reports, notices", "nar": "4.2 narrative; 4.3 retelling", "des": "4.2 descriptive text", "exp": "4.3 informative writing incl. expository", "arg": "6.2 exchanging views; 4.3 persuasion", "lit": "4.2 narrative prose and poetry", "read": "3.1–3.4 Reading", "lang": "Grammar (Appendix A)", "sum": "Reading 3.2–3.3; 4.1", "edit": "4.4 Check and edit", "oral": "2.x Speaking; 5.1–5.3 Spoken interaction"}, "TL": {"fw": "Written interaction LO1–2", "nar": "Writing LO2–3", "des": "Writing LO3", "exp": "Writing LO2–3", "arg": "Writing LO3; Written interaction LO2", "lit": "Writing LO3; Reading (appreciation)", "read": "Reading & viewing", "lang": "Grammar (Appendix 3)", "sum": "Writing (summarising)", "edit": "Writing LO1", "oral": "Speaking; Spoken interaction"}}, "mtlSkill": {"fw": "Written interaction (+ Writing)", "nar": "Writing", "des": "Writing", "exp": "Writing", "arg": "Writing / Written interaction", "lit": "Writing", "read": "Reading", "lang": "Language knowledge (across skills)", "sum": "Reading + Writing", "edit": "Writing", "oral": "Speaking / Spoken interaction"}, "clGoals": {"nar": {"G1": "能记叙事件，并简单地表达感受", "G2": "能用基本的表达方法，清楚完整地记事写人，并写出自己的真实感受", "G3": "能用不同的表达方法，具体生动地记事写人，并写出自己的真实感受", "H": "能用不同的表达方法，具体生动地记事写人，并写出自己的真实感受"}, "exp": {"G1": "能写出事物的特点和做事情的步骤", "G2": "能运用基本的说明方法，清楚地写出事物的特点和做事情的步骤", "G3": "能运用基本的说明方法，清楚地写出事物的特点和做事情的步骤", "H": "能运用恰当的说明方法，准确、清楚地说明事物的特点或事理，以及做事情的步骤"}, "arg": {"G1": "（以实用文表达看法）", "G2": "能清楚地表达自己的观点", "G3": "能清楚地表达自己的观点，并运用事例、对比等方法加以论证", "H": "能清楚地表达自己的观点，并运用事例、对比等方法加以论证"}, "fw": {"G1": "能写简单的实用文，传达信息，并能表达感受或看法；能对熟悉的话题表达感受或看法，并作出回应", "G2": "能写一般的实用文；能对一般的话题有条理地发表感受或看法，并作出回应", "G3": "能写一般的实用文；能对一般的话题有条理而又深入地发表感受或看法", "H": "能写复杂的实用文，传达信息，并表达感受或看法；能有条理而又深入地发表看法"}, "edit": {"G1": "能借助工具书检查并修改文字", "G2": "能初步修改自己的习作", "G3": "能修改自己的习作", "H": "能修改自己的习作"}, "lit": {"G1": "—", "G2": "能初步进行简单的文学创作", "G3": "能初步进行简单的文学创作", "H": "能进行简单的文学创作"}}, "clGoalsEn": {"nar": {"G1": "Recount events and express feelings simply", "G2": "Recount events and portray people clearly with basic techniques", "G3": "Recount and portray vividly with varied techniques", "H": "Recount and portray vividly with varied techniques"}, "exp": {"G1": "Write features and steps", "G2": "Use basic methods to explain features and steps", "G3": "Use basic methods to explain features and steps", "H": "Use apt methods to explain features, reasoning and steps precisely"}, "arg": {"G1": "(Views expressed through practical texts)", "G2": "State own view clearly", "G3": "State a view and support it with examples, contrast, etc.", "H": "State a view and support it with examples, contrast, etc."}, "fw": {"G1": "Simple practical texts; respond on familiar topics", "G2": "General practical texts; respond on general topics in order", "G3": "General practical texts; respond in order and in depth", "H": "Complex practical texts; respond in order and in depth"}, "edit": {"G1": "Check and correct with reference tools", "G2": "Begin revising own writing", "G3": "Revise own writing", "H": "Revise own writing"}, "lit": {"G1": "—", "G2": "First simple literary creation", "G3": "First simple literary creation", "H": "Simple literary creation"}}, "langName": {"CL": "Chinese Language", "ML": "Malay Language", "TL": "Tamil Language"}, "langNameM": {"CL": "华文", "ML": "Bahasa Melayu", "TL": "தமிழ்மொழி"}, "deptNote": "华文部：SEC会考的材料作文以记叙或说明的形式出现。CPDD教师手册在中四练习材料作文：记叙（快华单元二）和议论（快华单元五、高华单元三）。", "deptEn": "BVSS CL dept: material-based essays at SEC come as narrative or expository prompts. The CPDD guides practise material-based essays in Sec 4 as narrative (G3 Unit 2) and argumentative (G3 Unit 5, Higher Chinese Unit 3).", "mapNote": {"CL": "资料来源：各册教师手册的学习内容一览表（阅读、语文知识、说话、写作）以及各单元内容概要中的写作任务。@ 为书面互动学习点；@ 单元也以虚线列在所练习的文体之下。", "ML": "Sumber: TAJUK, MAHIR BAHASA dan PENULISAN dalam Gambaran Keseluruhan setiap Panduan Guru JATi, serta halaman unit untuk tujuan e-mel dan nota inkuiri. Unit 4–6 Menengah 4 ialah unit kemahiran.", "TL": "ஆதாரம்: தமிழருவி தொகுதிக் கண்ணோட்டங்களில் உள்ள ‘கற்போம்; படைப்போம் / நானும் ஒரு படைப்பாளி’ எழுத்துப் பணிகள், சுருக்கி வரைதல், பிழை திருத்தம், ஒவ்வொரு நடவடிக்கைக்குமான 21-ஆம் நூற்றாண்டுத் திறன் குறிப்பு. இலக்கணமும் நோக்கல் கருத்தறிதலும் ஆண்டுக்கு ஒருமுறை தரப்பட்டுள்ளன."}, "mapNoteEn": {"CL": "From each CL Teacher's Guide: the summary table of learning points per unit (reading, language knowledge, speaking, writing) and the writing task in each unit outline. Written-interaction units (marked @ in the guides) also appear, with a dashed edge, under the genre they practise.", "ML": "From each ML JATi Teacher's Guide: unit titles, grammar focus and writing in the unit overview tables, plus the unit pages for email purposes and inquiry notes. Sec 4 Units 4–6 are skills units.", "TL": "From the TL unit overviews: the writing tasks in the two writing sections of each unit, plus summary and error-correction rows, and the 21CC tag on each activity. Grammar and viewing rows are given once per year."}, "caveat": "Each entry is a skill point a guide names for a unit; a strand can still be practised elsewhere. ML and TL guides do not name a reading skill per unit, so reading rows are mostly CL. ML Sec 4 Units 4–6 are skills units whose per-course ticks did not survive extraction. TL Higher Sec 4 comes from a PDF without a Word version. Overview and comparison text stays in English in MTL mode.", "domains": {"keys": ["self", "family", "school", "community", "nation", "world"], "en": {"self": "Self", "family": "Family", "school": "School", "community": "Community & culture", "nation": "Nation (Singapore)", "world": "World & region"}, "note": "ML domains are the Domain row of each JATi Panduan Guru (CPDD). CL and TL domains are inferred from the unit theme wording by keyword rules in tools/enrich.py; a unit can carry more than one."}, "prov": {"cpdd": "CPDD-tagged", "derived": "Derived from a CPDD tag", "infer": "Inferred by rule"}, "rules": [{"id": "R1 view", "cats": ["CAIT", "PA_CM"], "why": "states and supports a view (critical thinking; courageous in voicing ideas)"}, {"id": "R2 interact", "cats": ["CCIS", "PA_CM"], "why": "responds to a reader or listener (communication; open-minded, empathetic)"}, {"id": "R3 civic", "cats": ["CGC", "PA_CL"], "why": "unit theme or task is about community, Singapore, culture or the world (civic literacy: CGC 1, understanding values and issues of community and national significance)"}, {"id": "R4 discern", "cats": ["CAIT", "PA_CL"], "why": "weighs facts, opinions, sources or media (critical thinking; discerning information, the school's Civic Literacy descriptor)"}, {"id": "R5 invent", "cats": ["CAIT", "PA_IT"], "why": "task asks students to generate, design, propose or refine ideas or solutions to an issue (MOE CAIT 5-6, Inventive Thinking). Writing a story, poem or poster no longer counts on its own"}, {"id": "R6 adapt", "cats": ["PA_AT"], "why": "task asks students to take another perspective, weigh a dilemma, adjust a strategy or apply skills in a new or unfamiliar context (MOE CAIT 3-4, Adaptive Thinking). A theme about change or challenge no longer counts on its own"}, {"id": "R7 inquiry", "cats": ["INQ"], "why": "task needs students to find out, plan, make or present (inquiry-shaped, not tagged by CPDD)"}, {"id": "DERIVE", "cats": ["PA_CM", "PA_CL", "PA_IT", "PA_AT"], "why": "CPDD 21CC domain tags mapped to BVSS E21CC priority areas: CCIS → Communication; CGC → Civic Literacy; CAIT → Inventive Thinking only where the task shows an inventive move (CAIT 5-6) and Adaptive Thinking only where it shows an adaptive move (CAIT 3-4); SEC no longer maps to a priority area (tightened 31 Oct 2026 against MOE's LG&M for E21CC)"}], "priNote": "BVSS E21CC priority areas (school approach from 2027): Adaptive Thinking, Inventive Thinking, Civic Literacy, Communication. No CPDD guide tags these, so every priority-area tag is either derived from a CPDD 21CC tag or inferred from the task by rule, using the definitions and learning goals in MOE's Learning Goals and Developmental Milestones for Emerging 21CC (20 Oct 2023): Adaptive Thinking = CAIT 3-4, Inventive Thinking = CAIT 5-6, Communication = CCI 1-2, Civic Literacy = CGC 1-2. Tightened 31 Oct 2026: a narrative or creative text no longer counts as Inventive Thinking, and a theme about change no longer counts as Adaptive Thinking; the task must show the move. Treat inferred tags as proposals to confirm in SOW planning.", "design": {"aspects": [["shape", "How a unit is built"], ["routines", "Signature routines"], ["writing", "How writing is taught"], ["oral", "Oral and read-aloud"], ["reading", "Reading"], ["assess", "Assessment inside the unit"], ["examform", "When the exam writing form becomes regular"], ["scope", "Topic-scope progression"], ["lod", "Within the language: how levels of demand differ"]], "glance": {"CL": "A self-to-world spiral every semester. Each book runs self or school, then family or community, then Singapore or the world, and the next book starts again. Progression is carried by the communicative move (narrate, describe, explain, give a view, respond), not by widening topics.", "ML": "The one that widens, and says so. Every unit carries a CPDD Domain tag: self and school in Sec 1, society by Sec 2, the region or world by the end of Sec 3; Sec 4 returns to self and society, then three skills units. Higher Malay starts at self-society-world from Book 1A.", "TL": "A fixed theme set rotated every year (relationships, heritage, health, nature, S&T, life skills, leisure and arts), shared by every course. Society and nation enters in 2B; the world and us closes Sec 3 and Sec 4. Progression sits in the production task, which widens from guided forms to typed, multimodal and online texts."}, "ev": {"CL": "G1 华文教师手册 一上 to 中四 read in full; G2, G3 and HCL from the roadmap dataset and the guides' 学习内容一览表.", "ML": "G1 Panduan Guru 1A to 4 (Units 1 to 3) read in full; Domain rows read from every course's guides; G2, G3 and HML lesson design assumed to follow the same JATi structure (verify).", "TL": "G1 unit overviews (கண்ணோட்டம்) read for 1A to Sec 4; lesson-prep PDFs could not be text-extracted; G2, G3 and HTL from the roadmap dataset (verify)."}, "cells": {"shape": {"CL": "引学练用评 in every unit, with separate 听说, 阅读 (生活空间 then 核心) and 写作 blocks, then 文化站, 综合任务 and 泛读. Three units per book.", "ML": "A one-period Pembuka Bicara hook, then three Bahagian each led by a key question, framed by one Pemahaman yang ingin dicapai and one or two of six language functions. Four units per book; Sec 4 has three content units and three skills units.", "TL": "One fixed cycle of about 15 periods: entry hook, think and discuss, read aloud and vocabulary, listening and viewing and reading comprehension, grammar and literature, language games, then the production task. Four or three units a book, seven in Sec 3, six in Sec 4."}, "routines": {"CL": "听说 三看三说 (看前说, 看后说, 延伸说); 阅读 立足文本三读 (初读, 再读, 三读); 写作 先说后写再查. Same routines in all four years; only the scaffolds thin.", "ML": "STP teaching actions head every lesson plan. Fikir-Berpasangan-Berkongsi (about 140 uses in the G1 guides) and Reviu Lisan (about 120) carry the lessons, with IRF questioning, Lihat-Fikir-Tanya and other thinking routines, and a 3-2-1 exit pass.", "TL": "The cycle itself is the routine: சிந்திப்போம்; கலந்துரையாடுவோம் before reading, படிப்போம் with சொற்பொருள் அறிவோம், then கலந்துரையாடுவோம்; கருத்துணர்வோம், and கற்போம்; படைப்போம் / நானும் ஒரு படைப்பாளி to produce."}, "writing": {"CL": "Staged and scaffolded: SLS 写作指导配套 for 审题 and micro-practice, 先说 (oral rehearsal with word and sentence scaffolds), 后写, 再查 (read to a partner, peer check against a checklist). G1 adds 打写加油站 typing support in Sec 1 to 2.", "ML": "Embedded in a Bahagian: discuss a model text (for example social-media comments), then write; no fixed check step. The response text (Teks Respons) is named and regular from Sec 3; Sec 4 Unit 6 is a writing-guides unit (formal email, response text, five expository types, speech).", "TL": "One production task per unit, often multimodal (e-banner, comic strip, poster, brochure, résumé with email). Guided completion in Sec 1 gives way to typed and online texts in Sec 4. Assessment sheets for self and peer checking sit in the appendices."}, "oral": {"CL": "A video or animation every unit taught through 三看三说; 口语互动 learning points marked #. 朗读 technique is taught inside 再读 and 三读 but with no explicit guide.", "ML": "An SLS video every unit. View-giving guides rise from Panduan Mari Berkongsi Pandangan (1A, 1B) to Mengembangkan Pandangan (1B), 5W1H and Soal Jawab (Sec 2), Memberikan Pandangan (Sec 3) and the Sec 4 Unit 4 toolkit (discussion, debate, presenting from audio or video). Panduan Bacaan Lantang appears from 1A.", "TL": "Viewing comprehension and discussion every unit. From Sec 3 the objectives ask for speaking about pictures in பேச்சுத்தமிழ் clearly, fluently and confidently. Read-aloud is taught inside படிப்போம்: pronunciation and pausing in Sec 1, intonation by Sec 4."}, "reading": {"CL": "Two texts a unit (生活空间 practical text, 核心 literary text) with one named reading skill per unit that converges on 主题; 阅读放大镜 questions, 阅读小贴士, digital text for decoding support.", "ML": "Reading sits inside each Bahagian (dialogue, article, literature extract) and Ehwal Semasa news; no reading skill is named per unit. Sec 4 Unit 5 is a critical-reading toolkit (purpose, argument, annotation, lenses, text-to-self and text-to-world).", "TL": "படித்துக் கருத்துணர்தல் with written answers every unit, plus முன்னுணர்வுக் கருத்தறிதல் (prior-knowledge comprehension) and நடப்புச் செய்திகள் current affairs from 2B."}, "assess": {"CL": "Workbook pages after each block; 再查 peer check; teacher-guide answer keys; SLS auto-marked items suggested.", "ML": "Anecdotal assessment is written into every lesson; Buku Aktiviti and SLS responses; the guide separates assessment for feedback from weighted assessment, and flags inquiry tasks usable as a WA.", "TL": "முழுமையான மதிப்பீடு (holistic assessment) tagged on activities; self and peer assessment sheets in the appendices."}, "examform": {"CL": "Sec 4: all three writing units are replies to an online post. Sec 1 to 3 build the moves: 短信 and 贴文, then 电邮 with 看法, then 讨论区 responses.", "ML": "Sec 3: half the writing tasks are Teks Respons; Sec 4 adds the writing-guides unit. The exam form (personal response to an online post, at least 60 words) is practised from 1B Unit 8.", "TL": "Only the last Sec 4 unit (comments on online posts). The G1 written-paper format is still unconfirmed, so confirm it before bringing the task forward."}, "scope": {"CL": "Spiral each semester; no CPDD domain tags. Domains on this page are inferred from theme wording.", "ML": "Widens by design; every unit carries a CPDD Domain tag (Diri, Keluarga, Sekolah, Masyarakat, Rantau, Dunia). The guide states that learning starts near the self before moving to society, nation and the world.", "TL": "Theme rotation; the same theme and sub-theme in every course each year. Domains here are inferred from the theme wording."}, "lod": {"CL": "G1 keeps the same routines but adds 图文 picture-text and 打写加油站 scaffolds in Sec 1 to 2 and sits one short online post in the exam. G2, G3 and HCL add essays (记叙, 说明, 议论) with 材料作文 in Sec 4; HCL adds 缩写 and 病句 from Sec 3. G2, G3 and HCL share Sec 1 to 2 themes; G1 shares most; themes split by course in Sec 3 to 4.", "ML": "Same JATi structure at every level; the difference is domain reach and function mix. G1 starts at Sekolah and Diri and reaches Rantau only in Sec 3 Unit 5; G2 reaches Dunia in Sec 4 Unit 3; G3 in 2B Unit 7; Higher Malay is Diri-Masyarakat-Dunia from 1A Unit 1. Higher Malay unit titles are proverbs.", "TL": "Same themes and cycle at every level. G1 writing is guided and multimodal; G3 and HTL practise summary from Sec 1 and add an argumentative essay and debate in Sec 3; HTL alone sits summary and word-joining in the exam."}}, "evEn": {"CL": "G1 Chinese teacher guides, Sec 1A to Sec 4, read in full; G2, G3 and HCL from the roadmap dataset and the guides' learning-content tables.", "ML": "G1 Malay teacher guides 1A to 4 (Units 1 to 3) read in full; Domain rows read from every course's guides; G2, G3 and HML lesson design assumed to follow the same JATi structure (verify).", "TL": "G1 Tamil unit overviews read for 1A to Sec 4; lesson-prep PDFs could not be text-extracted; G2, G3 and HTL from the roadmap dataset (verify)."}, "cellsEn": {"shape": {"CL": "Every unit runs lead in, learn, practise, apply, assess, with separate blocks for listening and speaking, reading (an everyday practical text, then a core literary text) and writing, followed by a culture corner, an integrated task and extended reading. Three units per book.", "ML": "A one-period opening-discussion hook, then three parts each led by a key question, framed by one intended understanding and one or two of six language functions. Four units per book; Sec 4 has three content units and three skills units.", "TL": "One fixed cycle of about 15 periods: entry hook, think and discuss, read aloud and vocabulary, listening and viewing and reading comprehension, grammar and literature, language games, then the production task. Four or three units a book, seven in Sec 3, six in Sec 4."}, "routines": {"CL": "Listening and speaking: \"three looks, three talks\" (talk before viewing, after viewing, and beyond it). Reading: three readings anchored in the text (first, second and third read). Writing: say it, write it, then check it. Same routines in all four years; only the scaffolds thin.", "ML": "Singapore Teaching Practice (STP) teaching actions head every lesson plan. Think-Pair-Share (about 140 uses in the G1 guides) and oral review (about 120) carry the lessons, with IRF questioning, See-Think-Wonder and other thinking routines, and a 3-2-1 exit pass.", "TL": "The cycle itself is the routine: \"Let's think\" and \"Let's discuss\" before reading; \"Let's read\" with \"Let's learn the word meanings\"; then \"Let's discuss\" and \"Let's understand\"; \"Let's learn\" (grammar); and \"Let's create\" / \"I too am a creator\" to produce."}, "writing": {"CL": "Staged and scaffolded: SLS writing-guidance packages for reading the task and micro-practice; say first (oral rehearsal with word and sentence scaffolds), then write, then check (read to a partner, peer check against a checklist). G1 adds a typing-support corner in Sec 1 to 2.", "ML": "Embedded in one part of the unit: discuss a model text (for example social-media comments), then write; no fixed check step. The response text is named and regular from Sec 3; Sec 4 Unit 6 is a writing-guides unit (formal email, response text, five expository types, speech).", "TL": "One production task per unit, often multimodal (e-banner, comic strip, poster, brochure, résumé with email). Guided completion in Sec 1 gives way to typed and online texts in Sec 4. Assessment sheets for self and peer checking sit in the appendices."}, "oral": {"CL": "A video or animation every unit, taught through \"three looks, three talks\"; spoken-interaction learning points are marked #. Read-aloud technique is taught inside the second and third readings, but with no explicit guide.", "ML": "An SLS video every unit. Guides for giving views rise from \"Let's share views\" (1A, 1B) to \"Developing views\" (1B), 5W1H and question-and-answer (Sec 2), \"Giving views\" (Sec 3) and the Sec 4 Unit 4 toolkit (discussion, debate, presenting from audio or video). A read-aloud guide appears from 1A.", "TL": "Viewing comprehension and discussion every unit. From Sec 3 the objectives ask for speaking about pictures in spoken Tamil clearly, fluently and confidently. Read-aloud is taught inside \"Let's read\": pronunciation and pausing in Sec 1, intonation by Sec 4."}, "reading": {"CL": "Two texts a unit (an everyday practical text and a core literary text) with one named reading skill per unit that converges on the unit theme; \"reading magnifier\" questions, reading tips, and a digital text for decoding support.", "ML": "Reading sits inside each part of the unit (dialogue, article, literature extract) and current-affairs news; no reading skill is named per unit. Sec 4 Unit 5 is a critical-reading toolkit (purpose, argument, annotation, lenses, text-to-self and text-to-world).", "TL": "Reading comprehension with written answers every unit, plus prior-knowledge comprehension and current-affairs news from 2B."}, "assess": {"CL": "Workbook pages after each block; peer check in the \"check\" step of writing; teacher-guide answer keys; SLS auto-marked items suggested.", "ML": "Anecdotal assessment is written into every lesson; activity book and SLS responses; the guide separates assessment for feedback from weighted assessment, and flags inquiry tasks usable as a WA.", "TL": "Holistic assessment tagged on activities; self and peer assessment sheets in the appendices."}, "examform": {"CL": "Sec 4: all three writing units are replies to an online post. Sec 1 to 3 build the moves: text messages and posts, then emails giving a view, then discussion-forum responses.", "ML": "Sec 3: half the writing tasks are response texts; Sec 4 adds the writing-guides unit. The exam form (personal response to an online post, at least 60 words) is practised from 1B Unit 8.", "TL": "Only the last Sec 4 unit (comments on online posts). The G1 written-paper format is still unconfirmed, so confirm it before bringing the task forward."}, "scope": {"CL": "Spiral each semester; no CPDD domain tags. Domains on this page are inferred from theme wording.", "ML": "Widens by design; every unit carries a CPDD Domain tag (self, family, school, society, region, world). The guide states that learning starts near the self before moving to society, nation and the world.", "TL": "Theme rotation; the same theme and sub-theme in every course each year. Domains here are inferred from the theme wording."}, "lod": {"CL": "G1 keeps the same routines but adds picture-and-text and typing-support scaffolds in Sec 1 to 2, and sits one short online post in the exam. G2, G3 and HCL add essays (narrative, expository, argumentative) with stimulus-based composition in Sec 4; HCL adds summary writing and sentence correction from Sec 3. G2, G3 and HCL share Sec 1 to 2 themes; G1 shares most; themes split by course in Sec 3 to 4.", "ML": "Same JATi structure at every level; the difference is domain reach and function mix. G1 starts at school and self and reaches the region only in Sec 3 Unit 5; G2 reaches the world in Sec 4 Unit 3; G3 in 2B Unit 7; Higher Malay is self-society-world from 1A Unit 1. Higher Malay unit titles are proverbs.", "TL": "Same themes and cycle at every level. G1 writing is guided and multimodal; G3 and HTL practise summary from Sec 1 and add an argumentative essay and debate in Sec 3; HTL alone sits summary and word-joining in the exam."}}, "stp": {"pdf": "https://file.go.gov.sg/stp-learning-orientations.pdf", "source": "MOE, Singapore Teaching Practice: An Overview of Learning Orientations", "ibl": {"kb": "https://go.gov.sg/stp-kb3-chapter14", "feature": "Learning is guided by a driving question. Students sort through complex issues and problems from several perspectives and draw their own conclusions.", "behaviours": ["ask authentic questions", "persist through uncertainty", "engage in evidence-based reasoning", "be curious about their world"], "pedagogies": ["Issue Investigation", "Predict–Observe–Explain (POE)", "Problem-based Learning"], "c21": ["Critical, Adaptive and Inventive Thinking", "Communication, Collaboration and Information Skills"]}, "bridge": ["Driving question: every ML unit is framed by an enduring understanding and essential questions, and each part opens with a key question. This is the nearest thing in the MTL guides to an STP driving question.", "ML STAR Team Inquiry (Scenario Analysis, Team Inquiry, Application, Reflection) is closest to Issue Investigation and Problem-based Learning: teams work a real scenario, then apply and reflect.", "ML Sec 3 Unit 4 (G1 and G2): plan a business or social enterprise that helps the community. This is the clearest problem-based task in the guides, and the guide says it can be a weighted assessment.", "TL G3 Book 2A Units 2 and 3 carry an e-pedagogy inquiry tag (newspaper report, formal email).", "CL guides name 引导——探究 as one of two teaching modes (示范——模仿 or 引导——探究) in the differentiated-instruction section of every book (checked across all 44 CL 教师手册 PDFs on the drive, 31 Oct 2026), and every unit ends with a 文化探索 extension (look something up online and share) and a 综合任务 (integrated task with 展示、交流和反思). None is tagged per unit, and the integrated tasks are not yet records in this dataset (HANDOFF.md, next step 2)."], "others": [["Dialogic Talk", "Language structures thinking: students think aloud, ask clarifying questions and build on others' ideas. Already common in MTL lessons (CL's three looks, three talks; ML Think-Pair-Share; TL think and discuss).", "https://go.gov.sg/stp-kb3-chapter20"], ["Embodied Learning", "The body's part in making meaning, for example drama-based pedagogy.", "https://go.gov.sg/stp-kb3-chapter18"], ["Experiential Learning", "Learning through authentic experience and reflection, for example field-based, place-based or service learning.", "https://go.gov.sg/stp-kb3-chapter17"], ["Disciplinary and Interdisciplinary Learning", "Connections within and across subjects, for example concept-based or project-based learning, design thinking.", "https://go.gov.sg/stpkb3chapt19"]]}, "about": {"over": {"what": "The common frame. Under SEC 2027, CL, ML and TL share the same three papers and the same weights, so the department can plan once and adapt for each language.", "points": ["Weights shift by course: G1 puts 65% on Paper 3 (oral and listening); Higher puts 40% on writing.", "Paper 1 tasks differ by language even within one course. At G1, all three ask for a short online response, but length and form differ (the TL G1 format is still to be confirmed).", "The last section shows where CPDD documents already point to inquiry and 21CC."], "use": "Start here, then open By language to go deep on one language."}, "lang": {"what": "One language in depth: its exam papers for each course, which strands its units teach and when, and how its guides differ from the other two.", "points": ["The Strand × Course bars count the Sec 1 to 4 units that name each strand; colour follows the exam paper.", "'Where the three differ' compares unit structure, routines, writing, oral preparation and topic scope across CL, ML and TL.", "The unit themes are listed at the end."], "use": "Pick the language with the language buttons above."}, "design": {"what": "How each language's teaching package is designed, set side by side, and how far each one widens its topics from Sec 1 to 4.", "points": ["CL spirals from self to world every semester; ML widens by design, with a CPDD domain on every unit; TL rotates a fixed set of themes every year.", "In the topic-scope ladder, each unit is a pill with dots for its topic domains. Solid dots come from the ML guides; dashed dots are inferred from CL and TL theme wording.", "The side-by-side table covers nine aspects of design and ends with how G1 to Higher differ within each language."], "use": "Switch the ladder between comparing languages (same course) and comparing courses (same language)."}, "map": {"what": "Every unit's learning points for one course, laid out by strand and year, set against that course's exam papers.", "points": ["Read along a row to see one strand build from Sec 1 to 4.", "The paper cards at the top show what the exam asks for, so you can see which units build toward it.", "'3 languages side by side' puts CL, ML and TL for the same course in one table."], "use": "Choose the course at the top and narrow by year if needed."}, "theme": {"what": "The unit themes of all three languages, year by year, with a header for each year that explains the thread behind the textbook's theme order and whether the courses share it.", "points": ["'3 languages side by side' opens each year with three headers, one per language: the path of topic domains, the thread that holds the year, and what it asks students to make meaning of.", "'One language' puts G1, G2, G3 and HMT in columns, with one summary per year saying whether the themes are identical across courses and, where they differ, what the difference says about the level of demand. Differing units are highlighted.", "Filter by course and year in either layout."], "use": "Read the header first, then scan the rows under it."}, "c21": {"what": "Where the 21st century competencies (21CC) appear in each language's units, Sec 1 to 4.", "points": ["Only the TL guides tag 21CC activity by activity. The CL and ML guides hardly tag it, so most CL and ML tags here are inferred.", "A blue tag is named in the CPDD guide; an amber tag is mapped from the task wording by a rule. Treat inferred tags as proposals.", "Click any unit card to see which tasks carry each tag and why."], "use": "Filter by language, course, year, competency and source. Heat-table cells read CPDD+inferred."}, "ibl": {"what": "Where inquiry-based learning, a BVSS school approach from 2027, already sits in the MTL units, and where it could go.", "points": ["The essence section sets out what MOE's Singapore Teaching Practice means by inquiry: five key elements, the inquiry cycle, the 5E model, structured to open approaches, and what makes it work.", "CPDD flags inquiry mainly in ML (STAR Team Inquiry in about a dozen units, and a community business plan in Sec 3 Unit 4), plus two TL G3 Sec 2 units. The CL guides name 引导——探究 (guided inquiry) as a teaching mode in every book's differentiated-instruction notes, and every CL unit ends with a 文化探索 extension and a 综合任务, but no CL unit is tagged, so CL inquiry on this page is inferred.", "Amber tags mark tasks that look inquiry-shaped (find out, plan, make or present) but are not tagged. The STP card under the roadmap gives the student behaviours to look for."], "use": "Click a unit card to see the task, the guide's note and the STP look-fors."}, "pri": {"what": "The four BVSS E21CC priority areas (Adaptive Thinking, Inventive Thinking, Civic Literacy, Communication) used as a lens on the units.", "points": ["No CPDD guide uses these areas, so every tag is either derived from a CPDD 21CC tag or inferred by rule.", "Derived tags rest on a CPDD tag and are the stronger evidence; inferred tags are proposals to confirm in SOW planning.", "Click a unit card to see the task behind each tag and the rule that placed it."], "use": "Hover a priority-area button to see its descriptor from the school slide."}, "syl": {"what": "How each strand of the roadmap lines up with the MTL Syllabus 2021 skills and with each language's own syllabus learning outcomes.", "points": ["Use it to cite the syllabus outcome behind a unit's learning point in SOW documents.", "The CL syllabus goals are also listed by course."], "use": ""}, "sow": {"what": "One scheme of work per language, course and year, laid out as four term columns so a teacher can see at a glance what Term 1 to Term 4 are expected to cover: units, themes, skills, CPDD tasks, 21CC, E21CC and assessment.", "points": ["Row headers follow the CPDD Tamil unit overview, with the extra columns from the Malay Skema Pengajaran sample added; the same frame serves all three languages.", "Writing, oral and listening rows list what the CPDD teacher guides themselves suggest for each unit. Click a unit for the full detail.", "Assessment timing follows the 2026 pattern on the 2027 school calendar: Sec 4 oral in Term 1, prelim written on 29 July, SEC written in September."], "use": "Pick a language, course and year. The top band shows how the school's vision maps to the E21CC focus areas and to MTL."}}, "iblsg": {"src": "STP Knowledge Base, Chapter 14: Inquiry-based Learning (IBL): Understanding and Enacting the Journey in Learning (Chue Kah Loong and Yvonne Seng)", "kb": "https://go.gov.sg/stp-kb3-chapter14", "essence": "In MOE's Singapore Teaching Practice, IBL is a constructivist approach: students explore a problem, issue, phenomenon or idea by working to resolve an inquiry question. The teacher shifts from telling to facilitating, so that students build 21CC (above all critical, adaptive and inventive thinking, and communication, collaboration and information skills) while still reaching the intended learning outcomes.", "elements": [["An inquiry question", "the question students set out to resolve drives the learning"], ["An authentic context", "the problem sits in the real world"], ["Growing self-direction", "students take more ownership over time"], ["Teacher as facilitator", "the teacher activates and guides rather than transmits"], ["Active learning", "students research, try things out, discuss and make"]], "cycle": [["Orientation", "Introduces the inquiry question or problem; sparks curiosity with a starter activity.", "Start thinking about the problem; ask questions."], ["Conceptualisation", "Links to prior knowledge; helps students form questions or hypotheses; clarifies concepts.", "Connect to what they know; generate questions or hypotheses."], ["Investigation", "Facilitates the activities; asks probing questions to deepen thinking.", "Research or experiment; make sense of findings; propose solutions."], ["Conclusion", "Checks understanding; summarises findings; leads reflection.", "Synthesise and share findings; reflect; give peer feedback."]], "discussion": "Discussion runs through every phase: students share findings, listen to others, give peer feedback and reflect.", "approaches": [["Structured", "Teacher gives the question and a step-by-step method; the outcome may be known. Low autonomy; builds basic inquiry skills."], ["Guided", "Teacher gives the question or problem; students decide the method and the solution. Medium to high complexity. For example problem-based or design-based learning."], ["Open", "Teacher sets a broad theme; students frame the question, method and solution. Highest autonomy; needs mature learners and skilled facilitation. For example project-based or place-based learning."]], "enablers": [["Open-ended questions", "Move students past yes-or-no answers to explain, connect and apply."], ["Scaffolding that fades", "Support early, withdrawn as students gain skill. Too much stifles independence; too little leaves students lost."], ["Feedback that feeds forward", "What went well, how to improve, what to explore next; aimed at the process and at self-regulation, not only the task."], ["Psychological safety", "Students can ask questions and take risks without fear of judgement; teachers attend to how students feel."]], "example": {"label": "The chapter's language-subject example (English)", "q": "How can we spot \"fake news\" and create awareness of it?", "steps": [["Orientation", "the teacher shows some sensationalised news"], ["Conceptualisation", "students ask what fake news is for and what it does"], ["Investigation", "students research online"], ["Conclusion", "students choose how to present what they found"]]}, "mtl": "Our reading for MTL: most tasks in the CPDD guides sit at the structured end, and ML's STAR Team Inquiry is a guided approach. Moving a unit's task toward guided inquiry mostly means opening with a real question, letting students choose how to find out, and building discussion and feed-forward into each phase.", "cycleNote": "The STP chapter uses Pedaste et al.'s (2015) general inquiry cycle, a synthesis of 32 published inquiry models. Teachers need not follow the phases in a fixed order; the cycle names what each part of an inquiry is for.", "fiveE": {"intro": "The 5E model (Bybee et al., 2006) is the inquiry cycle most teachers already know. The STP chapter presents it alongside the general cycle above.", "phases": [["Engage", "Hook interest and surface what students already think, with a question, puzzle, image or short clip.", "Orientation"], ["Explore", "Students investigate first-hand, before formal teaching: try things, gather information, talk it through.", "Conceptualisation + Investigation"], ["Explain", "The teacher focuses attention on key aspects of what students found, and students put their understanding into words; terms and concepts are made explicit here.", "Conclusion"], ["Elaborate", "Students extend and apply the understanding to a new situation or task.", "Investigation, applied to a new case"], ["Evaluate", "Students judge their own progress with the teacher's help; the teacher checks the learning outcomes.", "Conclusion (reflection)"]], "mapNote": "The ≈ line on each card is our rough match to the STP cycle, not the chapter's.", "mtl": "In an MTL unit, 5E maps onto routines that already exist. Engage is the unit's video or picture hook (CL three looks, three talks; ML opening discussion; TL think and discuss). Explore is reading and discussing the texts. Explain is the language point or text feature. Elaborate is the writing or speaking task. Evaluate is the peer check and self-assessment."}, "modes": "Inquiry can run inductively (students experience first, then draw the idea out, as in 5E), deductively (students propose a hypothesis, then test it), or as a mix (experience first, then form a hypothesis to investigate).", "terms": [["Driving (inquiry) question", "The open question the whole inquiry sets out to resolve."], ["Constructivism", "Learners build knowledge from experience and from what they already know (Piaget); social constructivism adds that this happens through language and interaction (Vygotsky)."], ["Zone of proximal development", "What a student can do with help but not yet alone; scaffolding works inside this zone."], ["Autonomy support and structure", "Giving meaningful choices plus clear goals, scaffolds and feedback; together they build intrinsic motivation."], ["Deep vs surface learning", "Making sense and connecting ideas, versus memorising; open questions push toward deep learning."], ["Feed up, feed back, feed forward", "Where am I going, how am I doing, what next (Hattie and Timperley)."], ["Feedback levels", "Task (is it right), process (how it was done), self-regulation (how the learner monitors and adjusts), self (personal praise, least useful)."]], "sketchNote": "A department sketch built from the unit's theme and its actual task; it is not from the CPDD guide. Adapt it or replace it in SOW planning.", "starNote": "STAR's stages line up with the cycle: Scenario Analysis covers Orientation and Conceptualisation, Team Inquiry is Investigation, and App
