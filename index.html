lication and Reflection form the Conclusion.", "approachDims": {"cols": ["Task complexity", "Information given", "Student autonomy", "Examples"], "rows": {"Structured": ["Low", "High", "Low", "School lab experiments"], "Guided": ["Medium to high", "Medium", "Medium", "Problem-based learning; design-based learning"], "Open": ["High", "Low", "High", "Project-based learning; place-based learning"]}}}, "iblx": {"CL|G1|4||5": {"q": "What does it take to chase a dream, and is it always worth it?", "approach": "Guided", "phases": ["Show a short clip or news story about a young Singaporean who chased an unusual dream.", "Students list what they want to know (What did the person give up? Who helped?) and predict the answers.", "In groups, read the unit texts plus one more story each, collecting striking sentences as evidence.", "Each group gives its view in a short discussion and responds to other groups' views (the unit's oral task)."]}, "ML|G1|2|2B|7": {"q": "What do interviewers look for, and how can I show it?", "approach": "Guided", "phases": ["Play a short mock interview that goes badly.", "Students say what went wrong and list what an interviewer wants to find out.", "Pairs read real job or CCA-leader ads and ask an adult who has interviewed people for common questions.", "Build the interview-preparation checklist (the unit's writing task), try it in a role-play, then give peer feedback."]}, "ML|G1|3||2": {"q": "What makes a message really lift someone up?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a classmate is discouraged before the exams. What do they need to hear?", "Students suggest what makes a message motivating and guess which words carry the feeling (interjections).", "Team inquiry: teams collect motivational posts and messages, then sort which work and why.", "Application and reflection: write the motivational message, swap, say which lines worked, reflect."]}, "ML|G1|3||3": {"q": "What makes someone a role model, and how do I find out?", "approach": "Guided", "phases": ["Show three very different people others call role models.", "Students draft questions they would ask, then sort open from closed questions (the unit's language focus).", "Each student picks a role model from family or community, finds out about them, then drafts and tests questions on a partner.", "Finalise the interview script; carry out the interview; reflect on which questions drew the best answers."]}, "ML|G1|3||4": {"q": "How could a small business help our community?", "approach": "Guided, moving to open", "phases": ["Show two or three local social enterprises.", "Students name community needs near school and turn one into a problem to solve.", "Teams find out more (observe, ask residents or family, look at similar businesses) and design the plan.", "Present the plan in a format the team chooses; peer feedback. The guide says this can be a weighted assessment."]}, "ML|G1|3||5": {"q": "How do we decide whether a strange story online is true?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: share a viral 'mystery' post.", "Students list what makes it believable or doubtful and propose other explanations.", "Team inquiry: teams check sources, look for evidence and test each explanation.", "Application and reflection: write the InstaPos post offering an alternative explanation with evidence; reflect on how they checked."]}, "TL|G1|1|1A|4": {"q": "Which life skill matters most for a Sec 1 student, and why?", "approach": "Structured", "phases": ["Share short scenarios (managing time, honesty, kindness).", "Students choose one skill and predict why it matters.", "Ask two schoolmates or family members for a real example, and note the points.", "Plan and give the short speech using those examples; class feedback."]}, "TL|G1|3||5": {"q": "Which parts of the Tamil way of life still shape our families today?", "approach": "Guided", "phases": ["Show pictures of everyday customs (kolam, food, greetings).", "Students ask which customs are still practised at home, and why.", "Ask family members and note one moment when a custom happens.", "Plan a story scene built around that custom; share and discuss what the class found."]}, "TL|G1|4||1": {"q": "What duties come with the rights we have as teenagers?", "approach": "Guided", "phases": ["Present a news item or scenario where a teen's right clashes with a responsibility.", "List rights; students generate questions about the matching duties.", "Prepare interview notes and interview a parent, teacher or peer.", "Share the findings; discuss where people agreed and disagreed."]}, "TL|G1|4||2": {"q": "Why do some traditions last while others fade?", "approach": "Guided", "phases": ["Show an old and a recent photo of the same festival.", "Students suggest reasons why the festival changed.", "As reporters, prepare interview questions and interview an elder.", "Report back; compare findings across the class."]}, "ML|G2|1|1B|7": {"q": "What helps people bend rather than break when things go wrong?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a student who lost a competition they trained hard for.", "Students suggest what helps people recover.", "Team inquiry: teams gather stories (unit texts, family, peers) and spot the strategies they share.", "Application and reflection: write 'How I overcame a difficulty' using a strategy found; reflect."]}, "ML|G2|2|2A|4": {"q": "Which place in Singapore is worth exploring, and how do we convince others?", "approach": "Guided", "phases": ["Show a map of lesser-known places.", "Each student picks a place and frames questions (how to get there, what is there, its history).", "Find out online or by visiting; record the route with directional words.", "Write the journal and the expository piece; classmates vote on where they would go."]}, "ML|G2|3||1": {"q": "Can we claim a right without taking on a responsibility?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a social-media case of someone claiming free speech.", "Students take a position and raise questions.", "Team inquiry: teams gather views and examples from news and people they know.", "Application and reflection: social-media response and expository description; reflect on how their view changed."]}, "ML|G2|3||2": {"q": "How do artists express who they are, and how should we respond to their work?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: watch a short local dance performance.", "Students ask what the choreographer wanted to say.", "Team inquiry: teams find out about the work and the artist and note specific details.", "Application and reflection: a formal email of appreciation citing those details; a narrative using flashback; reflect."]}, "ML|G2|3||4": {"q": "What problem in our community could a social enterprise solve?", "approach": "Guided, moving to open", "phases": ["Show a local social enterprise.", "Students name problems and frame one as a 'how might we' question.", "Teams look into the problem, its causes and existing solutions.", "Write the problem-and-solution piece and the social-enterprise plan; respond on social media. Can be a weighted assessment."]}, "ML|G2|3||5": {"q": "How do we decide whether a strange story online is true?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: share a viral 'mystery' post.", "Students list what makes it believable or doubtful and propose explanations.", "Team inquiry: teams check sources and evidence.", "Application and reflection: social-media response and a narrative story; reflect on how they checked."]}, "TL|G2|4||1": {"q": "Where should a teenager's rights end and their duties begin?", "approach": "Guided", "phases": ["Present a scenario where a teen's right clashes with a duty.", "Students frame questions to put to adults.", "Prepare and carry out interviews with two adults in different roles.", "Write the expository essay using the interview evidence."]}, "ML|G3|1|1B|7": {"q": "How do people find a way through a challenge?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a short story stopped just before its climax.", "Students predict how the character gets through it.", "Team inquiry: teams compare how several stories build to a climax and resolve it.", "Application and reflection: write a narrative with a clear climax and resolution; reflect."]}, "ML|G3|1|1B|8": {"q": "Is it really easier to build good habits when we are young?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: the proverb 'bend the bamboo while young' and a short scenario.", "Students say whether they agree and why.", "Team inquiry: teams ask older relatives about habits formed young or late and collect the stories.", "Application and reflection: write a full narrative that shows the proverb; reflect."]}, "ML|G3|2|2B|5": {"q": "How does a group become 'us' instead of 'me and them'?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a new student left out of a group.", "Students raise questions about what makes people feel they belong.", "Team inquiry: teams find out how a club or community welcomes newcomers.", "Application and reflection: an expository process text on building an inclusive group; reflect."]}, "ML|G3|3||1": {"q": "How do we build a class where every voice counts?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: a class disagreement that went badly.", "Students compare the rules in different classes.", "Team inquiry: teams survey classmates on what matters and compare charters from elsewhere.", "Application and reflection: the class charter and an expository comparison; reflect."]}, "TL|G3|2|2A|1": {"q": "What keeps a friendship going when friends change?", "approach": "Guided", "phases": ["Show a short vlog about friendship.", "Students ask questions and predict the answers.", "Survey or interview friends; summarise the sources (the unit's summary practice).", "Plan a vlog that presents what they found."]}, "TL|G3|2|2A|2": {"q": "Which hobbies are growing among teenagers at our school, and why?", "approach": "Guided", "phases": ["Show a news report about a hobby trend.", "Students suggest which hobbies are growing, and why.", "Run a short online survey and gather the data.", "Write a newspaper report on the findings."]}, "TL|G3|2|2A|3": {"q": "What one change would most reduce waste at our school?", "approach": "Guided", "phases": ["Show photos of waste around the school.", "Students suggest changes and predict their effect.", "Check the waste in one area and find out what other schools do.", "Write a formal email to the right person proposing the change."]}, "TL|G3|2|2B|1": {"q": "How has one everyday technology changed our lives, and where is it heading?", "approach": "Guided", "phases": ["Show an old and a new version of the same device.", "Students raise questions about how it changed.", "Look up its history and ask an elder what it was like before.", "Design an e-advertisement for its future version."]}, "TL|G3|4||2": {"q": "How are young Tamils in Singapore keeping traditions alive?", "approach": "Guided, moving to open", "phases": ["Share an example of a tradition given a modern twist.", "Students frame their own questions about it.", "Plan and carry out an interview with a young person who practises a tradition.", "Present the findings orally; the class compares them."]}, "TL|G3|4||3": {"q": "Who helped build the Singapore we live in, and what can we learn from them?", "approach": "Guided", "phases": ["Use the unit's interview report as the hook.", "Students choose a nation builder and frame questions.", "Find out about that person, and interview an elder if possible.", "Discuss the findings; write the essay on the topic."]}, "CL|H|1|1B|5": {"q": "What might our neighbourhood look like in 2050, and what will change it?", "approach": "Guided", "phases": ["Show images of the same Singapore street, then and now.", "Students suggest what will change and why.", "Draft interview questions for an elder or a planner, and look up planned developments.", "Write the time-machine visit to Future City and recount it orally."]}, "CL|H|4||3": {"q": "Does fear of failure hold teenagers back?", "approach": "Guided, moving to open", "phases": ["Use the unit's survey material on fear of failure.", "Students form a thesis.", "Run their own class survey and compare it with the given data.", "Write the argumentative essay proving the thesis, revise its language, and defend it orally."]}, "ML|H|3||1": {"q": "What does sharing fairly look like in our community today?", "approach": "Guided (STAR)", "phases": ["Scenario analysis: two neighbours, one with plenty and one in need.", "Students raise questions about what fair sharing means.", "Team inquiry: teams gather real examples (food banks, neighbours, school projects).", "Application and reflection: song lyrics or a poem, and a retelling essay; reflect."]}, "ML|H|3||4": {"q": "How can we best help a group in our community that needs support?", "approach": "Guided, moving to open", "phases": ["Share the story of someone who needed help.", "Students choose a group and frame questions about its needs.", "Find out about the group's needs and the help that already exists.", "Write the action plan and the story essay."]}, "TL|H|4||1": {"q": "How do people in different roles balance rights and duties?", "approach": "Guided", "phases": ["Present a scenario about a nurse or volunteer facing a dilemma.", "Students frame interview questions.", "Interview someone in a role with clear duties.", "Write up the interview."]}, "TL|H|4||2": {"q": "Should traditions change to stay alive?", "approach": "Guided, moving to open", "phases": ["Show a tradition practised in two very different ways.", "Students take a position and frame questions.", "Interview people from two generations.", "Write the opinion-expository essay using the interviews."]}}, "themeThread": {"note": "One header per language per year: the path the unit themes take (topic domains in order), the thread that holds the year together, and what that asks students to make meaning of. ML domains are CPDD's own tags; CL and TL domains are inferred from theme wording. Written by the department from the unit lists, 31 Oct 2026.", "CL": {"1": {"path": "school → family → nation ‖ self → self → community", "thread": "Two near-to-far spirals, one per semester. 1A starts in the new classroom, pulls back to the family at reunion, then pushes out to Singapore as a place to explore. 1B turns inward to character (habit, creativity) and ends with the unsung people who keep the community running.", "meaning": "The year builds a double identity: a new secondary student and a young Singaporean. The 1B pairing of habit → change → contribution says: what I do with myself becomes what I can give. Skills stay descriptive and narrative (people, cause and effect, detail), so the themes are ground students already stand on."}, "2": {"path": "family → self & others → community ‖ self → nation → world", "thread": "The object of care widens: love at home, then animals, then the environment. The object of belonging widens: my own growth, then home as Singapore (HDB, rain trees), then a connected but noisy world (fake news).", "meaning": "Sec 2 is where views and reasons begin in CL, and the themes give something to argue about at each ring. The last unit's 别上假信息的当 is the first place the guide asks students to weigh sources, the hinge into Sec 3 argument."}, "3": {"path": "self → self → community → community → school → self", "thread": "The adolescent's social world, shared by every course: companionship, health choices, the neighbourhood, dialogue and media, lifelong learning, then truth, goodness and beauty. No nation or world unit: the year is relational, not civic.", "meaning": "Sec 3 carries the argumentative load (举例、引用、对比、多方面论证), so CPDD keeps topics inside lived experience where students can reason from evidence they own. The closing 真善美 unit uses literary texts (micro-fiction) to make values the object of judgement rather than rules."}, "4": {"path": "G1 self → self → nation → community → self · G2 self → self → community → school → self · G3 community → world → self → community → self · HCL self × 5", "thread": "The leaving student: who am I, what do I stand for, where do I belong, what next. Themes split by course for the first time. G1 and G2 keep one Singapore or Nanyang-culture unit; G3 and HCL go philosophical (literature, balance, time, parting).", "meaning": "The SEC year does not widen scope further; it deepens stance. Every course ends on dreams, inclusion or time, which is the territory of the material-based and argumentative essay and of the oral's view questions. HCL's five self-domain units are reflective essay prompts in disguise."}}, "ML": {"1": {"path": "school/self (1A) → family, community (1B) · HML: self + community + world from Unit 1", "thread": "CPDD's own Domain row sets the order: identity, appearance, choices and music close to the student, then food, family and shared culture as the bridge into the community, with Arif Budiman values rising through the year (courtesy, giving, perseverance). Higher Malay opens at the community-world scale at once and titles every unit with a proverb.", "meaning": "The question of the year is who I am in my community, asked through describing and expressing. The proverb titles in HML, and the Nilai Budaya column in every unit, make the culture itself the text: students learn the language through the values it carries."}, "2": {"path": "self → self/family → self/family → self ‖ self/community → self/family/community → self/school/community → all four · HML adds world throughout", "thread": "Adolescence under pressure: time, body, growing up and aspiration in 2A; trends and pop culture, love, effort and knowledge, dreams in 2B. The community enters through peers and culture rather than through institutions.", "meaning": "The year forms values where they are tested: by peers (trends), by feelings (love) and by setbacks (effort). It is the natural home of view-giving (Panduan Memberikan Pandangan) because every unit asks students to take a position on something they live with."}, "3": {"path": "self/family/community → self/community → family/community → self/community → community/world → self/community/world", "thread": "The citizen: rights and responsibilities, voice, role models, service (the community business or social-enterprise plan in Unit 4), discernment about what is true online, then stewardship of one shared Earth.", "meaning": "The clearest civic year in any of the three languages, and the inquiry year: STAR Team Inquiry and the Unit 4 plan the guide says can be a weighted assessment. The response text (Teks Respons) becomes regular here, so students respond in writing to issues the units have made real."}, "4": {"path": "self/community → self/community → community/world, then three self-domain skills units", "thread": "Three content units ask where I am going (technology as companion, aspirations) and whether my language and people endure (Am I Malay?, the ark of my people, Malays will never vanish, thrive wherever you land). Three skills units then close the exam: listen and speak, read critically, master writing.", "meaning": "Sec 4 answers the Sec 1 question. 'Who are we' becomes 'will we last', which is Arif Budiman as a stance rather than a value label. The skills units say plainly that the exam year is for transfer, not new ground."}}, "TL": {"1": {"path": "self → community → self → self → self → self → community", "thread": "TL runs a fixed wheel of themes every year (relationships, heritage and culture, health, nature and environment, science and technology, life skills, leisure and arts, society and the world) and changes the sub-theme. Sec 1 anchors the wheel in the new student: change and new beginnings, the harvest festival, 'Tamil and me', goals; then the practical world of health, the internet and water.", "meaning": "Progression is carried by the sub-theme, not by widening domains: 'change' is new beginnings here and will be traditions in flux by Sec 4. The year makes being Tamil in Singapore personal (festival, language, goals) before it becomes social."}, "2": {"path": "self → self → community → community → self → self → nation/community", "thread": "The same wheel, one step out: friendship, hobbies, protecting the environment as a duty, heritage as history (cultural norms, Tamil kings), technology across time, money, and the first society-and-nation unit (youth and society).", "meaning": "From 'me' to 'me among others'. The year's last unit is the first explicit civic one, which is why the department's Sec 2 authentic assessment (40 Stories: interview and news report) sits naturally here."}, "3": {"path": "self → self → self → self → community → self → world", "thread": "Maturity: the arts, my relationships as my responsibility, leadership, living in harmony with nature, the Tamil way of life, mental well-being, then Tamil and the world. Seven units, all courses share them.", "meaning": "Sec 3 asks for views in spoken Tamil with reasons, so the sub-themes are ones students have a stake in (leadership, mental health). The world appears for the first time, through the Tamil diaspora, so 'us' becomes global before Sec 4 asks about duties."}, "4": {"path": "self → community → nation/community → self → self → world", "thread": "The citizen and the future: rights and duties, traditions in change, nation-building, enterprise, invention, a brand-new Earth. One wheel turn at full width.", "meaning": "The exam year is the widest year in TL. It ends on a global issue with the online-post task (comments on online posts), so the SEC writing form arrives together with the largest scope: students comment on the world as Singapore Tamils who have, by now, spoken about every theme four times."}}}, "themeCourse": {"note": "One summary per language per year for the one-language view: are the themes the same across G1, G2, G3 and HMT, and where they differ, what the difference says about the level of demand. Units whose theme differs from the other courses are highlighted in the rows.", "CL": {"1": "Identical in all four courses: the same six themes in the same order (G3 and HCL simply number Book 1B as Units 4 to 6). Demand is set elsewhere: the 核心 literary text is longer and the word list larger as the course rises, G1 adds 图文 and 打写 scaffolds, and the writing task runs from a typed post (G1) to an email plus essay (G2, G3, HCL). Meaning-making is shared: one school and family year that every Sec 1 student can talk about, whatever the class.", "2": "Identical in all four courses. The six themes widen care and belonging from family to world for everyone; what differs is what students are asked to do with them. G1 gives a view in a post, G2 and G3 begin the explanatory-argumentative essay (如何……、为什么……), and HCL reads the same 核心 texts for stance and structure. The shared theme set lets the department set one Sec 2 authentic assessment (40 Stories) across courses.", "3": "Nearly identical: four of six themes are word-for-word the same, and two are reworded by course. Unit 2 is 我的健康我做主 (my health, my call) for G1 but 健康生活 for the others; Unit 5 is 人生学堂 (school of life) for G1 and G2 but 学无止境 (learning never ends) for G3 and HCL. The rewording is the demand signal: G1 is turned toward personal agency and practical life skills, G3 and HCL toward lifelong learning as a value to argue for. Same social world, different stance expected.", "4": "Different in every course: Sec 4 is the only CL year where the four courses carry four separate theme sets. G1 stays concrete and Singapore-anchored (发现自我、面对挑战、情牵小红点、文化调色板、勇于追梦), which serves the oral and the short post. G2 keeps culture and inclusion (南洋华彩、关爱与包容) with essay-friendly life themes. G3 moves to abstraction (心手相连、文学世界、平衡之道、知己知彼). HCL is five reflective abstractions (适应、态度、成功、离别、时间) that read as essay prompts. Demand here equals abstraction: the higher the course, the further the theme is from a place or an act and the closer to an idea."}, "ML": {"1": "Different titles in every course, same skeleton. All four open with identity at school (Teguh Bersatu, Which one?, Need or want?, Usul Menunjukkan Asal), spend 1A on the self (appearance, choices, music), and use 1B for food and ties, resilience and giving. The demand shows in the title register: G1 statements (I can!), G2 and G3 questions and dilemmas (Want it? Afford it?; No pain, no gain), HML proverbs that must be interpreted before the unit can begin. CPDD's domain tags widen with the course: G1 stays in self and school until 1B, HML is self, community and world from Unit 1.", "2": "Different titles, shared anchors: time (U1), health and self-care (U2), growing up and change (U3), aspiration (U4), trends and pop culture (U5), love (U6), effort and knowledge (U7), dreams (U8). G1 keeps them concrete and imperative (Use it well!, Health first!), G3 abstracts them (Waves of change, Spread your wings), HML turns them into metaphor (Still waters, Nature is a teacher, Love like the pattern on a plate) and adds the world domain to almost every unit. Same adolescence, read at four depths.", "3": "Different titles, one civic thread: rights and responsibility (U1), expression (U2), role models (U3), community action or enterprise (U4), truth online (U5), one shared Earth (U6). G1 and G2 titles are plain questions (Is it true?, Rights without responsibility?); G3 and HML titles are idioms and proverbs (Not like the palm in the thicket, Strong because of its knot, Prop up the leaning, help the weak). The inquiry tasks (STAR, the Unit 4 business plan) sit in the same slots in every course, so the department can run one Sec 3 inquiry across courses with the title register as the differentiation.", "4": "Same structure in every course, different titles: three content units (technology and the future, aspirations, Malay identity) and the same three skills units (listening and speaking, reading, writing), which each guide titles in its own words (G1 Listen carefully, speak precisely; G3 Dancing pen, active mind; the G2 and HML dataset rows carry generic labels). The content titles grade the identity question: G1 asks Am I Malay? (personal), G2 Ark of my people, G3 Malays will never vanish, HML Thrive wherever you land (community and world). Demand runs from personal belonging to collective destiny, while the skills units say the exam year is the same job for everyone."}, "TL": {"1": "One theme set, three small rewordings. 1A Unit 3 'Tamil and me' is filed under Relationships in G1, G3 and HTL but under Heritage and culture in G2; 1A Unit 4 'Life skills' is 'Character' in G1 and 'Goals' in the other three; HTL's Unit 1 is 'New experiences' rather than 'New beginnings'. None changes what the unit is about. TL demand is never thematic: it sits in text length, the grammar and literature load, HTL's summary writing from Sec 1, and the production task (guided completion in G1, independent writing in G3 and HTL).", "2": "Identical except one sub-theme: 2A Unit 4 is 'Cultural norms and values' for G1 and HTL but 'Kings of Tamil history' for G2 and G3, both under Heritage and culture. Everything else is the same wheel, one turn out. The courses diverge in what they produce (G1 multimodal and guided, G3 and HTL extended writing) rather than in what they read about.", "3": "Identical in all four courses: the same seven units in the same order, from the arts to Tamil and the world. This is where G3 and HTL add the argumentative essay and debate while G1 and G2 keep to views with reasons in spoken Tamil, so the same theme (leadership, mental well-being, the diaspora) is handled as a position paper in one class and a discussion in another.", "4": "Identical in all four courses: rights and duties, traditions in change, nation-building, entrepreneurship, invention, a brand-new Earth. The exam components carry the demand: HTL alone sits summary and word joining, G3 and HTL write the longer essay, G1 writes the typed post. One theme wheel, four exam destinations."}}}, "sow": {"_readme": "Scheme of work 2027 data for BVSS MTL (CL, ML, TL; G1 to HMT; Sec 1 to 4). tools/enrich.py embeds this file as DATA.sow. The term grid on the 'Scheme of work 2027' tab is generated at run time from DATA.recs, DATA.themes and the tags, using the calendar, assessment pattern, pacing rules, WA formats, listening tasks and VMV mapping below. Edit here, then run python3 tools/enrich.py.", "version": "2026-10-31b", "about": {"what": "One scheme of work per language, course and year, laid out as four term columns so a teacher can see at a glance what Term 1 to Term 4 are expected to cover: units, themes, skills, CPDD tasks, 21CC, E21CC and assessment.", "points": ["Row headers follow the CPDD Tamil unit overview, with the extra columns from the Malay Skema Pengajaran sample added; the same frame serves all three languages.", "Writing, oral and listening rows list what the CPDD teacher guides themselves suggest for each unit. Click a unit for the full detail.", "Assessment timing follows the 2026 pattern on the 2027 school calendar: Sec 4 oral in Term 1, prelim written on 29 July, SEC written in September."], "use": "Pick a language, course and year. The top band shows how the school's vision maps to the E21CC focus areas and to MTL."}, "calendar": {"year": 2027, "source": "(Staff) and (Students) Bukit View Secondary 2026 Google calendars, 2027 entries as at 31 Oct 2026. Weeks run Monday to Friday; W1 of each term starts on the Monday shown.", "note": "Term 4 has two teaching weeks for Sec 1 to 3 before the EOY exams (30 Sep to 13 Oct). Sec 4 teaching effectively ends at the Term 3 prelim; SEC MTL papers are on 15 to 16 Sep with listening on 20 to 21 Sep.", "terms": [{"t": 1, "label": "Term 1", "start": "4 Jan", "end": "12 Mar", "weeks": 10, "teach": 9, "events": [{"w": 1, "d": "4 to 5 Jan", "what": "Sec 1 orientation"}, {"w": 5, "d": "3 to 5 Feb", "what": "MT CNY cultural booths (3 to 4 Feb) and CNY celebration (5 Feb), Sec 1 to 5", "mt": true}, {"w": 6, "d": "8 to 9 Feb", "what": "CNY public holiday and day off in lieu"}, {"w": 7, "d": "17 Feb", "what": "HBL 1 (Sec 1 to 5)"}, {"w": 9, "d": "1 Mar", "what": "HBL 2 · Sec 4 and 5 MT oral exam (school, SEC format)", "mt": true, "sec": [4]}, {"w": 10, "d": "10 Mar", "what": "Hari Raya Puasa public holiday"}]}, {"t": 2, "label": "Term 2", "start": "22 Mar", "end": "28 May", "weeks": 10, "teach": 9, "events": [{"w": 2, "d": "29 Mar", "what": "MT Hari Raya Puasa showcase, Sec 1 to 3 (rehearsal 25 Mar)", "mt": true}, {"w": 2, "d": "2 Apr", "what": "HBL 3 · Sec 3 MT oral exam", "mt": true, "sec": [3]}, {"w": 4, "d": "13 Apr", "what": "HBL 4"}, {"w": 5, "d": "22 Apr", "what": "HBL 5 · Sec 2 MT oral exam", "mt": true, "sec": [2]}, {"w": 7, "d": "7 May", "what": "Sec 3, 4 and 5 MT oral make-up (PM)", "mt": true, "sec": [3, 4]}, {"w": 8, "d": "14 May", "what": "HBL 6 · Sec 1 MT oral exam", "mt": true, "sec": [1]}, {"w": 9, "d": "17 and 20 May", "what": "Hari Raya Haji and Vesak Day public holidays"}, {"w": 10, "d": "28 May", "what": "Sec 1 and 2 MT oral make-up (PM) · STAR meeting", "mt": true, "sec": [1, 2]}]}, {"t": 3, "label": "Term 3", "start": "28 Jun", "end": "3 Sep", "weeks": 10, "teach": 9, "events": [{"w": 2, "d": "5 to 6 Jul", "what": "Youth Day holiday · HBL 7"}, {"w": 3, "d": "12 to 16 Jul", "what": "SEC MTL and EL oral examination (HBL 8 for Sec 1 to 5)", "mt": true, "sec": [4]}, {"w": 4, "d": "19 to 22 Jul", "what": "MT Fortnight programmes: Sec 1 (19 Jul), Sec 2 (20 Jul), Sec 3 (22 Jul), PM", "mt": true}, {"w": 5, "d": "26 to 27 Jul", "what": "MT Fortnight recess cultural booths, Sec 1 to 3", "mt": true}, {"w": 5, "d": "29 Jul", "what": "HBL 9 · Sec 4 and 5 MT prelim written papers (HMT, G3, G2, G1) · Sec 3 HMT timed practice on the G3 paper", "mt": true, "sec": [3, 4]}, {"w": 7, "d": "9 to 10 Aug", "what": "National Day holidays"}, {"w": 9, "d": "23 Aug to 2 Sep", "what": "Sec 4 and 5 prelim exam II (other subjects)", "sec": [4]}, {"w": 10, "d": "2 to 3 Sep", "what": "Teachers' Day concert and holiday"}]}, {"t": 4, "label": "Term 4", "start": "13 Sep", "end": "19 Nov", "weeks": 10, "teach": 2, "events": [{"w": 1, "d": "15 to 16 Sep", "what": "SEC written papers: MTL (G1, G2, G3, HMTL) Papers 1 and 2, PM", "mt": true, "sec": [4]}, {"w": 2, "d": "20 to 21 Sep", "what": "HBL 10 · SEC MTL listening comprehension, PM", "mt": true, "sec": [4]}, {"w": 3, "d": "30 Sep to 13 Oct", "what": "Sec 1 to 3 EOY exams (MT EOY P1 and P2 standardisation 5 to 7 Oct)", "mt": true, "sec": [1, 2, 3]}, {"w": 5, "d": "14 to 20 Oct", "what": "Marking days and checking of scripts"}, {"w": 6, "d": "18 Oct", "what": "MT Deepavali showcase, Sec 1 to 3 · Sec 1 MT CCM level 1 (19, 21, 26 Oct)", "mt": true}, {"w": 7, "d": "29 Oct", "what": "Last day of school (Deepavali holiday 28 Oct)"}]}]}, "assess": {"note": "Pattern as run in 2026 (WA1 in Term 1, WA2 in Term 2, WA3 in Term 3, EOY in Term 4), placed in the same weeks as 2026 where the 2027 calendar allows. Component formats are the 2026 MTL Assessment Component Standardisation sheets (draft for discussion). Confirm at the Term 4 2026 department meeting.", "1": [{"t": 1, "code": "WA1", "what": "Paper 2 component", "wk": "W8", "wt": "15%", "form": "paper", "comp": "P2 Component"}, {"t": 2, "code": "WA2", "what": "Paper 1 component", "wk": "W6 to 7", "wt": "15%", "form": "paper", "comp": "P1 Component"}, {"t": 2, "code": "Oral", "what": "EOY Paper 3 oral on HBL 6", "wk": "W8 · 14 May", "wt": "EOY", "form": "oral"}, {"t": 3, "code": "WA3", "what": "Authentic assessment", "wk": "W7 to 8", "wt": "15%", "form": "aa", "comp": "Authentic Assessment"}, {"t": 4, "code": "EOY", "what": "Papers 1 and 2 and listening comprehension", "wk": "30 Sep to 13 Oct", "wt": "55%", "form": "exam", "comp": "End-of-Year Exam Format"}], "2": [{"t": 1, "code": "WA1", "what": "Paper 1 component", "wk": "W8", "wt": "15%", "form": "paper", "comp": "P1 Component"}, {"t": 2, "code": "WA2", "what": "Authentic assessment (2026: BVSS 40 Stories, all three languages)", "wk": "W6 to 7", "wt": "15%", "form": "aa", "comp": "Authentic Assessment"}, {"t": 2, "code": "Oral", "what": "EOY Paper 3 oral on HBL 5", "wk": "W5 · 22 Apr", "wt": "EOY", "form": "oral"}, {"t": 3, "code": "WA3", "what": "Paper 2 component", "wk": "W7 to 8", "wt": "15%", "form": "paper", "comp": "P2 Component"}, {"t": 4, "code": "EOY", "what": "Papers 1 and 2 and listening comprehension", "wk": "30 Sep to 13 Oct", "wt": "55%", "form": "exam", "comp": "End-of-Year Exam Format"}], "3": [{"t": 1, "code": "WA1", "what": "Paper 2 component", "wk": "W8", "wt": "15%", "form": "paper", "comp": "P2 Component"}, {"t": 2, "code": "WA2", "what": "Paper 1 component", "wk": "W6 to 7", "wt": "15%", "form": "paper", "comp": "P1 Component"}, {"t": 2, "code": "Oral", "what": "EOY Paper 3 oral on HBL 3", "wk": "W2 · 2 Apr", "wt": "EOY", "form": "oral"}, {"t": 3, "code": "WA3", "what": "Authentic assessment (HMT: timed practice on the G3 prelim paper, 29 Jul)", "wk": "W7 to 8", "wt": "15%", "form": "aa", "comp": "Authentic Assessment"}, {"t": 4, "code": "EOY", "what": "Papers 1 and 2 and listening comprehension", "wk": "30 Sep to 13 Oct", "wt": "55%", "form": "exam", "comp": "End-of-Year Exam Format"}], "4": [{"t": 1, "code": "NWA1", "what": "Non-weighted assessment in SEC format", "wk": "W8", "wt": "0%", "form": "paper", "comp": "P2 Component"}, {"t": 1, "code": "Oral", "what": "School MT oral exam in SEC format, on HBL 2", "wk": "W9 · 1 Mar", "wt": "school", "form": "oral", "new": true}, {"t": 2, "code": "TP", "what": "Timed practice: full Paper 1 and Paper 2", "wk": "W6 to 7", "wt": "practice", "form": "paper", "comp": "P1 Component"}, {"t": 3, "code": "SEC oral", "what": "SEC MTL oral examination", "wk": "W3 · 12 to 16 Jul", "wt": "national", "form": "oral"}, {"t": 3, "code": "Prelim", "what": "MT prelim written papers (HMT, G3, G2, G1) on HBL 9", "wk": "W5 · 29 Jul", "wt": "prelim", "form": "exam", "comp": "End-of-Year Exam Format", "new": true}, {"t": 4, "code": "SEC", "what": "SEC MTL Papers 1 and 2 (15 to 16 Sep) and listening (20 to 21 Sep)", "wk": "W1 to 2", "wt": "national", "form": "exam"}]}, "pacing": {"note": "How units are laid across terms. Sec 1 and 2: Book A over Terms 1 and 2, Book B over Terms 3 and 4 with at most one unit in Term 4. Sec 3: two units in Term 1, one in Term 2 (oral exam and WA2 term), two or three in Term 3, the last in Term 4 only if the course has seven. Sec 4: content units over Terms 1 to 3, Term 4 is revision and the SEC. ML Sec 4 pairs each content unit (1 to 3) with a skills unit (4 to 6) in the same term, so the oral toolkit (Unit 4) lands in Term 1 with the oral exam.", "sec12": {"A": [0.5, 0.5], "B_t4_max": 1}, "sec3": {"6": [2, 1, 2, 1], "7": [2, 2, 2, 1], "5": [2, 1, 2, 0]}, "sec4": {"5": [2, 2, 1, 0], "6": [2, 2, 2, 0], "ml": "pair"}}, "e21moves": {"PA_AT": {"en": "Adaptive Thinking", "move": "Students meet a dilemma, another perspective or an unfamiliar context, and adjust their approach or view because of it (CAIT 3-4). A theme about change is not enough: the student has to do the adapting.", "prompt": "Where in this unit do students have to take another perspective or change their strategy, and how would we see it?", "moe": "Apply learnt knowledge and skills strategically and flexibly in different or new and evolving contexts.", "goals": "CAIT 3 Assesses different contexts and situations in order to make connections and draw new insights · CAIT 4 Manages complexities and ambiguities by adjusting one's perspective and strategies", "lower": "3.3 Understand the similarities and differences between contexts and how this affects their perspective or approach · 4.3 Draw on different perspectives and strategies to adjust their approach, applying learnt knowledge and skills in unfamiliar contexts", "upper": "3.4 Draw on similarities and differences between contexts to extract new insights that inform their perspective or approach · 4.4 Draw on different perspectives and strategies to adjust their approach when required, adapting learnt knowledge and skills in new and unexpected contexts to solve complex and unexpected problems"}, "PA_IT": {"en": "Inventive Thinking", "move": "Students generate, compare and refine ideas or solutions to an issue (CAIT 5-6): proposals, designs, plans, improvements. Writing a story or making a poster is a product, not inventive thinking, unless the task asks for new ideas and a reason why they work.", "prompt": "What issue do students respond to with ideas of their own, and where do they evaluate and refine those ideas?", "moe": "Frame, investigate and explore issues, generate innovative ideas, and evaluate them to form novel and useful responses.", "goals": "CAIT 5 Explores possibilities and generates novel and useful ideas · CAIT 6 Evaluates and refines ideas to formulate novel and useful solutions", "lower": "5.3 Generate ideas that may involve modifying existing ones and explore different pathways appropriate to an issue or challenge · 6.3 Evaluate and refine their ideas using relevant strategies and criteria appropriate to the task or context", "upper": "5.4 Generate ideas that are unique or modified substantially from existing ones and explore different pathways that lead to solutions · 6.4 Evaluate and refine their ideas iteratively, using relevant strategies and criteria appropriate to the task or context"}, "PA_CL": {"en": "Civic Literacy", "move": "Students connect the theme to Singapore, their community or the world, and weigh sources and perspectives responsibly.", "prompt": "Which community, national or global angle does the text open, and whose voice is missing?", "moe": "Understand the nation's values, governance, context and realities, form one's civic identity, and constructively engage with and contribute to one's community and nation.", "goals": "CGC 1 Demonstrates understanding of values, ideals and issues of personal, community and national significance · CGC 2 Plays active and constructive roles to improve the school, community and nation"}, "PA_CM": {"en": "Communication", "move": "Students put a view or message across to a real reader or listener and respond to others' views.", "prompt": "Who is the audience of the unit's oral and written tasks, and do students get a response?", "moe": "Convey information and exchange ideas clearly and coherently through multimodal ways for specific purposes, audiences and contexts.", "goals": "CCI 1 Effectively communicates information and co-constructs meaning · CCI 2 Engages empathetically with diverse perspectives"}}, "e21src": "Definitions, learning goals and secondary milestones: MOE 21st Century Competencies Office, Learning Goals and Developmental Milestones for Emerging 21CC (20 Oct 2023), read on OPAL2 on 31 Oct 2026; assessment principles: Guidelines on the Assessment of Emerging 21CC (Feb 2025). School descriptors: BVSS E21CC priority areas slide.", "wa": {"source": "2026 MTL Assessment Component Standardisation.xlsx (sheets CL, ML, TL; draft for discussion, Oct 2026)", "by": {"CL": {"G1|1": {"P1 Component": "• 30 min\n• 10 marks\n• 1 question\n• Sentence Writing - 2 Pictures with helping words provided. Students to write complete sentences based on the pictures.\n\n(Note: transition writing task to bridge to Social Media Post response from S2 onwards)", "P2 Component": "• 40 min\n• 25 marks\n• Section A (15 marks): Language Application (15 MCQ, Passage type - conversation and short text)\n• Section B (10 marks): Comprehension 2 (5 MCQ, Passage type - 2 short passages)\n\nWA Prep Vocab list - 20 selected vocab", "Authentic Assessment": "TBC", "End-of-Year Exam Format": "Paper 1: Writing (10%)\nDuration: 30 mins | 10 marks\n\nPaper 2: Language Application & Comprehension (25%)\nDuration: 40 mins | 25 marks\n\nPaper  <h3>The 5E model</h3><p class="sub">${esc(F.intro)}</p><div class="fivee">${F.phases.map(([n,d,m],i)=>`<div class="e5"><div class="l">${i+1}</div><b>${esc(n)}</b><p>${esc(d)}</p><span class="m">≈ ${esc(m)}</span></div>`).join("")}</div><p class="note" style="margin:6px 0 0">${esc(F.mapNote)}</p><p class="callout">${esc(F.mtl)}</p>
 <p class="sub" style="margin-top:12px"><b>Inductive, deductive or both.</b> ${esc(G.modes)}</p>
 <h3>How much the students steer</h3><div class="spec"><div class="bar3"><span>Teacher-led</span><span>Student-led</span></div><div class="g3c">${G.approaches.map(([n,d])=>`<div class="ap"><b>${esc(n)}</b><p>${esc(d)}</p></div>`).join("")}</div>${G.approachDims?`<div class="scroll" style="margin-top:10px"><table class="dims"><thead><tr><th>Approach</th>${G.approachDims.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${Object.entries(G.approachDims.rows).map(([n,v])=>`<tr><td><b>${esc(n)}</b></td>${v.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="note" style="margin:4px 0 0">STP Knowledge Base chapter 14, Table 3 (after Bell et al., 2005).</p>`:""}</div>
 <h3>What makes it work</h3><div class="g4">${G.enablers.map(([n,d])=>`<div class="en4"><b>${esc(n)}</b><p>${esc(d)}</p></div>`).join("")}</div>
 <h3>${esc(G.example.label)}</h3><div class="exq"><div class="q">“${esc(G.example.q)}”</div><ol>${G.example.steps.map(([n,d])=>`<li><b>${esc(n)}:</b> ${esc(d)}</li>`).join("")}</ol></div>
 <p class="callout">${esc(G.mtl)}</p>
 <details class="terms"><summary>Key terms</summary><dl>${G.terms.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl></details>
 <p class="ev" style="margin-top:12px">Source: ${esc(G.src)}. ${ext(G.kb,"Read the chapter (MOE login)")}</p></section>`;
 return h}
function stpCard(){const S=DATA.design&&DATA.design.stp;if(!S)return"";const I=S.ibl,li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 return `<div class="card stp"><div class="eyebrow">MOE Singapore Teaching Practice · Learning Orientations</div><h3>What counts as inquiry-based learning</h3><p>${esc(I.feature)}</p>
 <div class="g3"><div><b style="font-size:13px">Students will</b>${li(I.behaviours)}</div><div><b style="font-size:13px">Example pedagogies</b>${li(I.pedagogies)}</div><div><b style="font-size:13px">21CC it builds</b>${li(I.c21)}</div></div>
 <h4>How the MTL guides line up (closest match)</h4>${li(S.bridge)}
 <details style="margin-top:10px"><summary class="note" style="cursor:pointer">The other four STP learning orientations</summary><ul>${S.others.map(([n,d,u])=>`<li><b>${esc(n)}</b>: ${esc(d)} ${ext(u,"KB chapter")}</li>`).join("")}</ul></details>
 <div class="links">${ext(S.pdf,"STP Learning Orientations overview (PDF)")}${ext(I.kb,"STP Knowledge Base: Inquiry-based Learning chapter")}</div></div>`}
function unitPanel(id){
 const [L,c,sec,book,unit]=id.split("|");const rs=DATA.recs.filter(r=>r.lang===L&&r.course===c&&String(r.sec)===sec&&r.book===book&&String(r.unit)===unit);if(!rs.length)return;
 const r0=rs[0],el=st.mode==="el",lens=st.tab,keys=Object.keys(DATA.cat).filter(k=>DATA.cat[k].lens===lens);
 const task=r=>el?esc(r.task_en):`<span lang="${ML_[L]}">${esc(r.task_m||r.task_en)}</span>${r.task_m&&r.task_m!==r.task_en?` <span class="why">(${esc(r.task_en)})</span>`:""}`;
 const sn=k=>k&&SK[k]?sname(k,L):(k||"");
 const pvl={cpdd:"from the CPDD guide",derived:"derived from a CPDD tag",infer:"inferred by rule"};
 const lensName={c21:"21CC roadmap",ibl:"Inquiry (IBL) roadmap",pri:"E21CC priorities"}[lens];
 let h=`<button class="x" data-close>Close</button><div class="eyebrow">${esc(DATA.langName[L])} · ${esc(c==="H"?"HMT":DATA.courseEn[c])} · ${esc(secName(+sec,L))} · ${esc(bk(r0))} Unit ${esc(unit)}</div><h3>${two(r0.theme_m,r0.theme_en,L)}</h3>`;
 h+=`<h4>Why this unit is on the ${lensName}</h4>`;
 const ks=keys.filter(k=>rs.some(r=>(r.tags||[]).some(t=>t.k===k)));
 for(const k of ks){const hits=rs.map(r=>[r,(r.tags||[]).find(t=>t.k===k)]).filter(x=>x[1]);
  const best=hits.some(x=>x[1].src==="cpdd")?"cpdd":hits.some(x=>x[1].src==="derived")?"derived":"infer";
  h+=`<div class="tg"><span class="tag cat-${k} src-${best}${best==="cpdd"?"":" inf"}">${esc(catName(k))}<span class="pv">${pvl[best]}</span></span>`;
  if(DATA.cat[k].desc)h+=`<p class="why">${esc(DATA.cat[k].desc)}</p>`;
  h+=`<ul>${hits.map(([r,t])=>{const note=lens==="ibl"?(el?r.ibl_en:(r.ibl||r.ibl_en)):(r.c21_en||"");
   return `<li><b>${esc(sn(r.strand))}${r.also?` + ${esc(sn(r.also))}`:""}:</b> ${task(r)}${r.purpose?` <span class="why">· purpose: ${esc(pur(r.purpose,L))}</span>`:""}<div class="why">${t.src==="cpdd"?`Guide says: ${esc(note||"tagged in the CPDD guide")}`:t.src==="derived"?`${esc(t.rule)}${note?` (guide says: ${esc(note)})`:""}`:`Why tagged: ${esc(t.rule)}`}</div></li>`}).join("")}</ul>`;
  if(best==="infer")h+=`<p class="why">Inferred: the guide does not name this here. The task gives an opening for it; how far to bring it out is the department's call. To confirm or drop it, see HANDOFF.md, next step 3.</p>`;
  else if(best==="derived")h+=`<p class="why">Derived: CPDD tags a 21CC domain on this task, and the school's mapping (CAIT → Adaptive + Inventive Thinking, CCIS → Communication, CGC → Civic Literacy, SEC → Adaptive Thinking) turns it into this priority area.</p>`;
  h+=`</div>`}
 h+=`<h4>Everything this unit teaches</h4><table><thead><tr><th>Strand</th><th>Task</th><th>Syllabus area</th><th>Exam</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(sn(r.strand))}${r.also?` + ${esc(sn(r.also))}`:""}</td><td>${task(r)}</td><td>${esc(el?(r.syl_en||r.syl):(r.syl||r.syl_en))}</td><td>${esc(r.exam||"")}</td></tr>`).join("")}</tbody></table>`;
 const IG=DATA.design&&DATA.design.iblsg,SKU=lens==="ibl"&&DATA.design&&DATA.design.iblx&&DATA.design.iblx[id];
 if(SKU){const isStar=rs.some(r=>(r.tags||[]).some(t=>t.k==="STAR"));h+=`<h4>What the inquiry could look like</h4><div class="sk"><div class="eyebrow">Inquiry question</div><div class="q">${esc(SKU.q)}</div><span class="ap">${esc(SKU.approach)} inquiry</span><ol>${["Orientation","Conceptualisation","Investigation","Conclusion"].map((n,i)=>`<li><b>${n}:</b> ${esc(SKU.phases[i])}</li>`).join("")}</ol>${isStar?`<p class="why" style="margin:8px 0 0">${esc(IG.starNote)}</p>`:""}<p class="why" style="margin:6px 0 0">${esc(IG.sketchNote)}</p></div>`}
 const SP=DATA.design&&DATA.design.stp;if(lens==="ibl"&&SP)h+=`<h4>STP look-fors if you run this as inquiry</h4><p style="font-size:13px;margin:0">Frame the task around a driving question. The STP expects students to:</p><ul>${SP.ibl.behaviours.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="why" style="margin-top:4px">${ext(SP.ibl.kb,"STP Knowledge Base: Inquiry-based Learning")} · ${ext(SP.pdf,"Learning Orientations overview (PDF)")}</p>`;
 const D=DATA.design;if(D){const C=el&&D.cellsEn||D.cells;h+=`<h4>How ${esc(DATA.langName[L])} lessons are usually run</h4><p style="font-size:13px;margin:0">${esc(C.routines[L])}</p><p class="why" style="margin-top:6px">This describes the language's G1 package as a whole (Pedagogical design tab), not this unit's lesson steps.</p>`}
 h+=`<p class="ev" style="margin-top:14px">Lesson-by-lesson steps are not in this dataset yet. For those, open ${esc(bk(r0))} Unit ${esc(unit)} in the CPDD teacher guide.</p>`;
 let d=$("#ud");if(!d){d=document.createElement("dialog");d.id="ud";document.body.appendChild(d);d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-close]"))d.close()})}
 d.innerHTML=`<div class="in">${h}</div>`;d.showModal();d.querySelector(".in").scrollTop=0;
}
document.addEventListener("click",e=>{const c=e.target.closest(".ucard[data-u]");if(c&&!e.target.closest("dialog"))unitPanel(c.dataset.u)});
document.addEventListener("keydown",e=>{const c=e.target.closest&&e.target.closest(".ucard[data-u]");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();unitPanel(c.dataset.u)}});
function render(){
 document.documentElement.lang=st.mode==="el"?"en":ML_[st.lang];
 $("#h1").textContent=st.mode==="el"?DATA.ui.title.en:DATA.ui.title[ML_[st.lang]];
 controls();hero();
 $("#view").innerHTML=({over:vOverview,lang:vLang,design:vDesign,map:vMap,theme:vTheme,c21:vRoads,ibl:vRoads,pri:vRoads,syl:vSyl,sow:vSow}[st.tab])();
 $("#foot").innerHTML=`<div class="fgrid"><div><div class="fb"><span class="mark">MTL</span><b>MTL Skills Roadmap</b></div><p>${esc(st.mode==="el"?DATA.ui.sub.en:DATA.ui.sub[ML_[st.lang]])}</p><p class="fine">Maintained by the BVSS MTL Department · updated 31 October 2026</p></div>
 <div><h4>Sources</h4><p>CPDD teacher guides for the 2021 syllabus: ${st.mode==="el"?"CL Teacher's Guides; ML JATi Teacher's Guides (OPAL2); TL Teacher's Guides":"CL 《华文伴我行》教师手册; ML JATi Panduan Guru (OPAL2); TL தமிழருவி ஆசிரியர் கையேடு"}. MTL, CL, ML and TL Secondary Syllabuses 2021. SEAB SEC 2027 syllabuses (<a href="https://www.seab.gov.sg/secondary-education-certificate-sec/g3-syllabuses-for-school-candidates-2027/" target="_blank" rel="noopener">seab.gov.sg</a>).</p></div>
 <div><h4>References</h4><ul>${[["https://go.gov.sg/stp-kb3-chapter14","STP Knowledge Base: Inquiry-based Learning"],["https://file.go.gov.sg/stp-learning-orientations.pdf","STP Learning Orientations (PDF)"],["https://www.moe.gov.sg/education-in-sg/21st-century-competencies","MOE 21st Century Competencies"],["https://github.com/kaixinbuilds/mtl-skills-roadmap","Page source and update notes"]].map(([u,t])=>`<li>${ext(u,t)}</li>`).join("")}</ul></div></div><p class="fine">${esc(DATA.caveat)}</p>`;
 document.querySelectorAll("[data-lens]").forEach(b=>b.onclick=()=>{st.lens=b.dataset.lens;st.cats=[];render()});
 document.querySelectorAll("[data-lang2]").forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang2;render()});
 document.querySelectorAll("[data-crs2]").forEach(b=>b.onclick=()=>{st.crs=b.dataset.crs2;render()});
 document.querySelectorAll("[data-ssec]").forEach(b=>b.onclick=()=>{st.ssec=+b.dataset.ssec;render()});
 document.querySelectorAll("[data-csv]").forEach(b=>b.onclick=()=>{b.dataset.csv==="sow"?sowCSV():roadsCSV()});
 document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{st.sL=b.dataset.sl;if(st.sL!=="All")st.lang=st.sL;render()});
 document.querySelectorAll("[data-mlay]").forEach(b=>b.onclick=()=>{st.mlay=b.dataset.mlay;render()});
 document.querySelectorAll("[data-tlay]").forEach(b=>b.onclick=()=>{st.tlay=b.dataset.tlay;render()});
 document.querySelectorAll("[data-lay]").forEach(b=>b.onclick=()=>{st.lay=b.dataset.lay;render()});
 document.querySelectorAll("[data-ss]").forEach(b=>b.onclick=()=>{const v=b.dataset.ss;st.sS=v==="All"?"All":+v;render()});
 document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{st.sC=b.dataset.sc;render()});
 document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{st.src=b.dataset.src;render()});
 document.querySelectorAll("[data-dcrs]").forEach(b=>b.onclick=()=>{st.crs=b.dataset.dcrs;render()});
 document.querySelectorAll("[data-dlang]").forEach(b=>b.onclick=()=>{st.lang=b.dataset.dlang;render()});
 document.querySelectorAll("[data-dlay]").forEach(b=>b.onclick=()=>{st.dlay=b.dataset.dlay;render()});
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{const k=b.dataset.cat;if(k==="__clear")st.cats=[];else st.cats=st.cats.includes(k)?st.cats.filter(x=>x!==k):[...st.cats,k];render()});
 try{localStorage.setItem("mtlrm2",JSON.stringify(st))}catch(e){}
 const hs=`#${st.tab}-${st.lang}-${st.crs}`+(["c21","ibl","pri"].includes(st.tab)?`?l=${st.sL}&c=${st.sC}&s=${st.sS}&src=${st.src}${st.cats.length?"&cats="+st.cats.join(","):""}`:st.tab==="sow"?`?s=${st.ssec}`:"");try{if(location.hash!==hs)history.replaceState(null,"",hs)}catch(e){}
}

addEventListener("hashchange",()=>{applyHash();render()});
render();
</script>
